name: foresight_core
description: Flutter-independent Open Foresight application logic.
publish_to: none
version: 0.1.3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  # Declare the annotation dependency used to confine recording mutation to tests.
  meta: ^1.16.0
  clock: ^1.1.2
  mcp_dart: 2.4.3
  grpc: 4.3.1
  http2: 2.3.1
  protobuf: 5.1.0
  sqlite3: 2.9.4
  crypto: 3.0.7
  ffi: 2.2.0
  fixnum: 1.1.1
  intl: 0.20.3
  path: 1.9.1
  html: 0.15.7
  enough_convert: 1.7.1
  charset: 2.0.1
dev_dependencies:
  analyzer: 14.6.0
  foresight_test_support:
    path: ../foresight_test_support
  fake_async: ^1.3.3
  coverage: ^1.16.0
  matcher: ^0.12.20
  test: ^1.25.15
  lints: ^6.1.0
