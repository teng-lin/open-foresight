name: Bug report
description: Report a problem with Open Foresight.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Everything you enter here is public.
        Open Foresight never uploads logs or diagnostics; only what you paste
        below is shared. Report security problems privately as described in
        [SECURITY.md](https://github.com/teng-lin/open-foresight/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under Settings → Version, for example "Open Foresight 0.1.3 (build 4)".
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Operating system version
      description: For example "macOS 15.1" or "Ubuntu 24.04".
    validations:
      required: false
  - type: textarea
    id: health
    attributes:
      label: Diagnostics health summary (optional)
      description: |
        In Settings → Diagnostics, choose "Copy health summary" and paste it
        here. It contains only status values and counters. See
        https://github.com/teng-lin/open-foresight/blob/main/docs/diagnostics.md
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log excerpts (optional)
      description: |
        Paste only the few log lines around the problem, after reading them.
        Logs contain no content, paths or account details, but they do show
        when the app ran and which features failed. Do not attach the whole
        logs folder.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: review
    attributes:
      label: Review
      options:
        - label: I reviewed everything above, including any diagnostics, and it contains nothing I do not want to publish.
          required: true
