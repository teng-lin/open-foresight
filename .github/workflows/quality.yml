name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  migration-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify frozen migrations against independently fetched main
        run: python tools/check_migration_integrity.py
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: mypy
      - run: python tools/check_subprocess_timeouts.py
      - name: Check offline documentation links
        run: python -m tools.check_document_links
      - name: Install pinned protobuf compiler for contract tests
        run: |
          task_protoc="$RUNNER_TEMP/quality-protoc"
          curl --fail --location --retry 3 --max-time 120 -o "$task_protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          printf '%s  %s\n' '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7' "$task_protoc.zip" | sha256sum --check
          unzip -q "$task_protoc.zip" -d "$task_protoc"
          test "$("$task_protoc/bin/protoc" --version)" = 'libprotoc 35.1'
          echo "$task_protoc/bin" >> "$GITHUB_PATH"
      - name: Provision pinned acceptance evidence fixture
        env:
          FORESIGHT_EVIDENCE_CACHE: ${{ runner.temp }}/evidence-fixtures
        run: python -m tools.evidence_fixture --fetch
      - name: Offline Python unit tests
        env:
          FORESIGHT_EVIDENCE_CACHE: ${{ runner.temp }}/evidence-fixtures
        run: python -m pytest --cov --cov-config=.coveragerc --cov-report=term --cov-report=xml --durations=20 --junitxml=coverage/python/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-coverage
          path: |
            coverage/python/coverage.xml
            coverage/python/junit.xml
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-format.lock
      - name: Check C and C++ formatting
        run: git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.mm' ':!:third_party/**' | xargs -0 clang-format --dry-run --Werror
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/flutter
          key: quality-flutter-linux-3.35.7
      - name: Install pinned Dart formatter
        run: |
          if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
            git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          "$RUNNER_TEMP/flutter/bin/dart" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Check Dart formatting
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned protobuf toolchain
        run: |
          curl --fail --location --retry 3 -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' | sha256sum --check
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo '/tmp/protoc/bin' >> "$GITHUB_PATH"
          (cd tools/protoc_plugin && dart pub get --enforce-lockfile)
          echo "$PWD/tools/protoc_plugin/bin" >> "$GITHUB_PATH"
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify protobuf shape and generated Dart drift
        run: |
          python tools/check_dart_bindings.py
          python -m pytest tests/contracts/test_descriptor.py tests/contracts/test_owned_descriptors.py
