name: Independent Linux application stages
on:
  workflow_call:
    inputs:
      core_coverage_benchmark:
        type: boolean
        default: false
      source:
        type: string
        required: true
      own_pr:
        type: number
        default: 0
      event:
        type: string
        required: true
      release:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  FORESIGHT_STAGE_ENVIRONMENT: build/stage-environment.json
  FORESIGHT_FLUTTER_EXECUTABLE: /opt/foresight-flutter/bin/flutter
  LIBGL_ALWAYS_SOFTWARE: '1'
  FORESIGHT_LINUX_UI_TEST: '1'
  FORESIGHT_REQUIRE_NATIVE_UI_TEST: '1'
jobs:
  native-linux:
    name: native-linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 90
    outputs:
      identity: ${{ steps.stage.outputs.identity }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      runtime_artifact_name: ${{ steps.stage.outputs.runtime_artifact_name }}
    steps:
      - name: Bootstrap Git in the pinned Arch container
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-linux-stage
        with:
          stage: native
      - name: Linux Python host contracts
        run: .venv/bin/python tools/platform_python_tests.py --platform linux
      - name: Validate or restore the native stage
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_EVENT: ${{ inputs.event }}
          OWN_PR: ${{ inputs.own_pr }}
          RELEASE_VALIDATION: ${{ inputs.release }}
          STAGE_PARENTS: '{}'
        run: |
          args=()
          if [[ "$RELEASE_VALIDATION" == true ]]; then args+=(--release); fi
          xvfb-run -a dbus-run-session -- .venv/bin/python tools/run_ci_stage.py \
            --platform linux --stage native --event "$STAGE_EVENT" --own-pr "$OWN_PR" \
            --parents-json "$STAGE_PARENTS" --cmake-arg=-G --cmake-arg=Ninja "${args[@]}"
      - name: Retain the independently qualified native stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            build/ci-stage/linux-native/identity.json
            build/ci-stage/linux-native/payload.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Retain the small native compilation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-${{ steps.stage.outputs.artifact_name }}
          path: build/ci-stage/linux-native/identity.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Retain the slim native runtime prerequisite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.runtime_artifact_name }}
          path: |
            build/ci-stage/linux-native-runtime/identity.json
            build/ci-stage/linux-native-runtime/payload.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-native-evidence
          path: |
            test-results/
            coverage/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          overwrite: true
  core-linux:
    name: core-linux
    needs: [native-linux]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 90
    outputs:
      identity: ${{ steps.stage.outputs.identity }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
    steps:
      - name: Bootstrap Git in the pinned Arch container
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-linux-stage
        with:
          stage: core
      - name: Download the successful native prerequisite from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.native-linux.outputs.runtime_artifact_name }}
          path: build/ci-input/native
      - name: Validate or restore the core stage
        id: stage
        env:
          FORESIGHT_COVERAGE: ${{ inputs.core_coverage_benchmark && '1' || '0' }}
          FORESIGHT_CORE_COVERAGE_MIN: '90'
          GH_TOKEN: ${{ github.token }}
          STAGE_EVENT: ${{ inputs.event }}
          OWN_PR: ${{ inputs.own_pr }}
          RELEASE_VALIDATION: ${{ inputs.release }}
          STAGE_PARENTS: '{"native":"${{ needs.native-linux.outputs.identity }}"}'
        run: |
          args=()
          if [[ "$RELEASE_VALIDATION" == true ]]; then args+=(--release); fi
          xvfb-run -a dbus-run-session -- .venv/bin/python tools/run_ci_stage.py \
            --platform linux --stage core --event "$STAGE_EVENT" --own-pr "$OWN_PR" \
            --parents-json "$STAGE_PARENTS" --cmake-arg=-G --cmake-arg=Ninja \
            --input native=build/ci-input/native "${args[@]}"
      - name: Retain the independently qualified core stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            build/ci-stage/linux-core/identity.json
            build/ci-stage/linux-core/payload.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Retain core diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-core-evidence
          path: |
            test-results/
            coverage/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          overwrite: true
  desktop-linux:
    name: desktop-linux
    needs: [native-linux]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 90
    outputs:
      identity: ${{ steps.stage.outputs.identity }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
    steps:
      - name: Bootstrap Git in the pinned Arch container
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-linux-stage
        with:
          stage: desktop
      - name: Download the successful native prerequisite from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.native-linux.outputs.runtime_artifact_name }}
          path: build/ci-input/native
      - name: Validate or restore the desktop stage
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_EVENT: ${{ inputs.event }}
          OWN_PR: ${{ inputs.own_pr }}
          RELEASE_VALIDATION: ${{ inputs.release }}
          STAGE_PARENTS: '{"native":"${{ needs.native-linux.outputs.identity }}"}'
        run: |
          args=()
          if [[ "$RELEASE_VALIDATION" == true ]]; then args+=(--release); fi
          xvfb-run -a dbus-run-session -- .venv/bin/python tools/run_ci_stage.py \
            --platform linux --stage desktop --event "$STAGE_EVENT" --own-pr "$OWN_PR" \
            --parents-json "$STAGE_PARENTS" --cmake-arg=-G --cmake-arg=Ninja \
            --input native=build/ci-input/native "${args[@]}"
      - name: Fresh fast integration against the current native prerequisite
        run: xvfb-run -a dbus-run-session -- .venv/bin/python tools/integration_gates.py --suite fast --native build/native/libforesight_native.so --output test-results/fast-integration
      - name: Retain the independently qualified desktop stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            build/ci-stage/linux-desktop/identity.json
            build/ci-stage/linux-desktop/payload.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Retain desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-desktop-evidence
          path: |
            test-results/
            coverage/
            apps/desktop/coverage/lcov.info
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          overwrite: true
  service-linux:
    name: service-linux
    needs: [native-linux, core-linux, desktop-linux]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 90
    outputs:
      identity: ${{ steps.stage.outputs.identity }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
    steps:
      - name: Bootstrap Git in the pinned Arch container
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-linux-stage
        with:
          stage: service
      - name: Download the successful native prerequisite from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.native-linux.outputs.runtime_artifact_name }}
          path: build/ci-input/native
      - name: Download the successful core prerequisite from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.core-linux.outputs.artifact_name }}
          path: build/ci-input/core
      - name: Validate or restore the service stage
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_EVENT: ${{ inputs.event }}
          OWN_PR: ${{ inputs.own_pr }}
          RELEASE_VALIDATION: ${{ inputs.release }}
          STAGE_PARENTS: '{"native":"${{ needs.native-linux.outputs.identity }}","core":"${{ needs.core-linux.outputs.identity }}","desktop":"${{ needs.desktop-linux.outputs.identity }}"}'
        run: |
          args=()
          if [[ "$RELEASE_VALIDATION" == true ]]; then args+=(--release); fi
          xvfb-run -a dbus-run-session -- .venv/bin/python tools/run_ci_stage.py \
            --platform linux --stage service --event "$STAGE_EVENT" --own-pr "$OWN_PR" \
            --parents-json "$STAGE_PARENTS" --cmake-arg=-G --cmake-arg=Ninja \
            --input native=build/ci-input/native \
            --input core=build/ci-input/core "${args[@]}"
      - name: Retain the independently qualified service stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            build/ci-stage/linux-service/identity.json
            build/ci-stage/linux-service/payload.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Retain service diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-service-evidence
          path: |
            test-results/
            coverage/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          overwrite: true
