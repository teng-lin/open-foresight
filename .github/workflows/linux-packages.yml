name: Linux packages
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-packages-${{ github.event_name == 'pull_request' && github.ref || inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bundle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release view must see the unpublished draft.
      actions: read
    timeout-minutes: 65
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: refs/tags/${{ inputs.tag }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Require an unpublished draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
    - name: Require the tag version and fetch the tested commit candidate
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN: ${{ inputs.candidate_run }}
      run: |-
        python3 tools/app_version.py --check
        python3 - <<'PY'
        import os,subprocess
        from tools.app_version import read_version
        version,_=read_version()
        if os.environ['RELEASE_TAG']!='v'+version: raise SystemExit('Release tag/version mismatch')
        epoch=subprocess.check_output(['git','show','-s','--format=%ct','HEAD'],text=True).strip()
        with open(os.environ['GITHUB_OUTPUT'],'a') as output: print(f'version={version}', f'release={os.environ["PACKAGE_RELEASE"]}', f'epoch={epoch}', sep=chr(10), file=output)
        PY
        python tools/ci_artifacts.py pull --component linux-app --identity "$(git rev-parse HEAD)" --prefix dist/packages --wait 3600 --run-id "$CANDIDATE_RUN"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: portable-bundle
        path: dist/packages/
        if-no-files-found: error
        retention-days: 14
  publish:
    if: github.event_name != 'pull_request'
    needs:
    - bundle
    - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: artifacts
    - name: Attach tested Linux packages to release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
        gh release upload "$RELEASE_TAG" \
          artifacts/portable-bundle/* \
          artifacts/open-foresight-deb-x86-64/*.deb* \
          artifacts/open-foresight-rpm-x86-64/*.rpm* \
          artifacts/open-foresight-arch-x86-64/*.pkg.tar.zst*

  packages:
    if: github.event_name != 'pull_request'
    needs: bundle
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - format: deb
          image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        - format: rpm
          image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
        - format: arch
          image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: refs/tags/${{ inputs.tag }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: portable-bundle
        path: artifacts
    - name: Native package and installation lifecycle
      env:
        FORMAT: ${{ matrix.format }}
        IMAGE: ${{ matrix.image }}
        VERSION: ${{ needs.bundle.outputs.version }}
        RELEASE: ${{ needs.bundle.outputs.release }}
        SOURCE_DATE_EPOCH: ${{ needs.bundle.outputs.epoch }}
      run: |
        docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH "$IMAGE" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" "$RELEASE"
    - name: Test Debian 13 with the Ubuntu-built DEB
      if: matrix.format == 'deb'
      run: |
        docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD:/work:ro" -v "$PWD/dist/packages:/packages:ro" debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 bash /work/packaging/ci/test-debian.sh
    - name: Collect package artifacts
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" dist/packages 2>/dev/null || true
    - name: Select installer for attestation
      id: installer
      run: |
        installer=$(find dist/packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \))
        test "$(printf '%s\n' "$installer" | wc -l)" = 1
        test -f "$installer"
        echo "path=$installer" >> "$GITHUB_OUTPUT"
    - name: Generate installer SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
      with:
        file: ${{ steps.installer.outputs.path }}
        syft-version: v1.33.0
        format: spdx-json
        output-file: ${{ runner.temp }}/installer.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Attest installer provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: ${{ steps.installer.outputs.path }}
    - name: Attest installer SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
      with:
        subject-path: ${{ steps.installer.outputs.path }}
        sbom-path: ${{ runner.temp }}/installer.spdx.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: success()
      with:
        name: open-foresight-${{ matrix.format }}-x86-64
        path: dist/packages/
        if-no-files-found: error
        retention-days: 14
  ubuntu-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
    - name: Free hosted-runner space for the Ubuntu package build
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Fetch verified Linux SDK descriptor
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |-
        # Forks retain local validation without consuming untrusted archives.
        if [[ "$FORK_PR" == true ]]; then
          tools/build_linux_sdk_local.sh
          echo 'image=foresight-sdk:pr' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python tools/ci_artifacts.py pull --component linux-sdk --prefix build/sdk-descriptor --wait 12600 --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
        python tools/linux_sdk_artifacts.py resolve --prefix build/sdk-descriptor --discard-archive
    - name: Package version
      id: version
      run: |
        python3 - <<'PY'
        import os, subprocess, sys
        sys.path.insert(0, 'tools')
        from app_version import read_version, stale
        if paths := stale():
            raise SystemExit('Out of date with apps/desktop/pubspec.yaml: ' + ', '.join(paths))
        version, _ = read_version()
        release = '1'
        epoch = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'version={version}\nrelease={release}\nepoch={epoch}\n')
        PY
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: ${{ steps.sdk.outputs.cache && 'docker-container' || 'docker' }}
    - name: Authenticate private SDK registry
      env:
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Build the Ubuntu 24.04 application bundle
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/build.Dockerfile
        target: artifact
        outputs: type=local,dest=build/portable
        build-args: |
          SDK_IMAGE=${{ steps.sdk.outputs.image }}
          SOURCE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
        cache-from: ${{ steps.sdk.outputs.cache && format('type=registry,ref={0}', steps.sdk.outputs.cache) || '' }}
    - name: Build and install the Ubuntu 24.04 package
      env:
        VERSION: ${{ steps.version.outputs.version }}
        RELEASE: ${{ steps.version.outputs.release }}
        SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
      run: |
        python3 packaging/package_linux.py --bundle build/portable/dist/open-foresight --format tar --version "$VERSION" --release "$RELEASE"
        mkdir -p artifacts
        cp dist/packages/*.tar.gz dist/packages/*.tar.gz.sha256 artifacts/
        docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac bash packaging/ci/package-and-test.sh deb "$VERSION" "$RELEASE"
on:
  workflow_call:
    inputs:
      candidate_run:
        type: string
        default: "0"
      tag:
        required: true
        type: string
      package_release:
        required: true
        type: string
  pull_request:
    paths:
    - apps/desktop/**
    - packages/foresight_core/**
    - packaging/**
    - .github/workflows/linux-packages.yml
    - native/**
    - services/**
    - proto/**
    - cmake/**
    - CMakeLists.txt
    - third_party/**
    - tools/package.py
    - tools/build.sh
    - requirements-*.lock
env:
  RELEASE_TAG: ${{ inputs.tag }}
  PACKAGE_RELEASE: ${{ inputs.package_release }}
