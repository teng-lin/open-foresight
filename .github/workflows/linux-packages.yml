name: Linux packages
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-packages-${{ github.event_name == 'pull_request' && github.ref || inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bundle:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release view must see the unpublished draft.
      actions: read
    timeout-minutes: 65
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      epoch: ${{ steps.version.outputs.epoch }}
      formats: ${{ steps.version.outputs.formats }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require an unpublished draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
    - name: Require the tag version and fetch the tested commit candidate
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN: ${{ inputs.candidate_run }}
        FORMATS: ${{ inputs.rpm_only && 'rpm' || inputs.format || 'all' }}
      run: |-
        python -m tools.release_inputs --tag "$RELEASE_TAG" --generation "$PACKAGE_RELEASE" --formats "$FORMATS"
        if grep -Fq 'formats=[]' "$GITHUB_OUTPUT"; then exit 0; fi
        source=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
        python tools/ci_artifacts.py pull --consumer release-preparation --component linux-app --identity "$source" --prefix dist/packages --wait 0 --run-id "$CANDIDATE_RUN"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.version.outputs.formats != '[]'
      with:
        name: portable-bundle
        path: dist/packages/
        if-no-files-found: error
        retention-days: 90
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.rpm_only
    needs:
    - bundle
    - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: open-foresight-*-x86-64
        path: artifacts
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: portable-bundle
        path: artifacts/portable-bundle
    - name: Attach tested Linux packages to release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
        files=()
        while IFS= read -r -d '' file; do files+=("$file"); done < <(find artifacts -maxdepth 2 -type f ! -name abi.json ! -name sdk-reference.json ! -name source-qualification.json -print0)
        if [[ -f artifacts/portable-bundle/abi.json ]]; then files+=(artifacts/portable-bundle/abi.json); fi
        python -m tools.release_upload --tag "$RELEASE_TAG" "${files[@]}"


  packages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.bundle.outputs.formats != '[]'
    needs: bundle
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    env:
      PACKAGE_CONTAINER: package-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(needs.bundle.outputs.formats) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Allow isolated document namespaces in package-test containers
      run: bash tools/ci_package_sandbox.sh
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: portable-bundle
        path: artifacts
    - name: Create installer bytes without installation
      id: build
      env:
        FORMAT: ${{ matrix.format }}
        IMAGE: ${{ matrix.format == 'deb' && 'ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac' || matrix.format == 'rpm' && 'fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80' || 'archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1' }}
        VERSION: ${{ needs.bundle.outputs.version }}
        RELEASE: ${{ needs.bundle.outputs.release }}
        SOURCE_DATE_EPOCH: ${{ needs.bundle.outputs.epoch }}
      run: |
        docker run --rm -d --name "$PACKAGE_CONTAINER" --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH "$IMAGE" sleep infinity
        docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" "$RELEASE" build
    - name: Retain built installers before lifecycle validation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: open-foresight-${{ matrix.format }}-x86-64
        path: dist/packages/
        if-no-files-found: ignore
        retention-days: 90
    - name: Native package and installation lifecycle
      id: lifecycle
      env:
        FORMAT: ${{ matrix.format }}
        VERSION: ${{ needs.bundle.outputs.version }}
        RELEASE: ${{ needs.bundle.outputs.release }}
      run: docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" "$RELEASE" test
    - name: Test Debian 13 with the Ubuntu-built DEB
      if: matrix.format == 'deb'
      run: |
        docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work:ro" -v "$PWD/dist/packages:/packages:ro" debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 bash /work/packaging/ci/test-debian.sh
    - name: Collect package artifacts
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" dist/packages 2>/dev/null || true
    - name: Select installer for attestation
      id: installer
      run: |
        installer=$(find dist/packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \))
        test "$(printf '%s\n' "$installer" | wc -l)" = 1
        test -f "$installer"
        echo "path=$installer" >> "$GITHUB_OUTPUT"
    - name: Generate installer SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        file: ${{ steps.installer.outputs.path }}
        syft-version: v1.33.0
        format: spdx-json
        output-file: ${{ runner.temp }}/installer.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Attest installer provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: ${{ steps.installer.outputs.path }}
    - name: Attest installer SBOM
      uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
      with:
        subject-path: ${{ steps.installer.outputs.path }}
        sbom-path: ${{ runner.temp }}/installer.spdx.json
    - name: Record validation independently of retained installer bytes
      if: always()
      env:
        BUILD_RESULT: ${{ steps.build.outcome }}
        LIFECYCLE_RESULT: ${{ steps.lifecycle.outcome }}
        FORMAT: ${{ matrix.format }}
      run: |
        mkdir -p test-results/package
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        Path('test-results/package/validation.json').write_text(json.dumps({key: os.environ[key] for key in ('BUILD_RESULT', 'LIFECYCLE_RESULT', 'FORMAT', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA')}))
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: package-validation-${{ matrix.format }}
        path: test-results/package/
        retention-days: 90
    - name: Remove disposable package-test container
      if: always()
      run: docker rm -f "$PACKAGE_CONTAINER" 2>/dev/null || true

on:
  workflow_dispatch:
    inputs:
      format:
        description: Installer formats to create from existing candidates
        type: choice
        options: [all, deb, rpm, arch]
        default: all
      candidate_run:
        description: Successful original candidate run (no recompilation)
        required: true
        type: string
      tag:
        description: Existing unpublished release tag
        required: true
        type: string
      package_release:
        description: Existing draft package release number
        required: true
        type: string
      rpm_only:
        description: Recover only RPM; retain artifacts without uploading to the draft
        type: boolean
        default: false
  workflow_call:
    inputs:
      format:
        type: string
        default: all
      rpm_only:
        type: boolean
        default: false
      candidate_run:
        type: string
        default: "0"
      tag:
        required: true
        type: string
      package_release:
        required: true
        type: string

env:
  RELEASE_SOURCE_FLOOR: ${{ vars.RELEASE_SOURCE_FLOOR }}
  RELEASE_TAG: ${{ inputs.tag }}
  PACKAGE_RELEASE: ${{ inputs.package_release }}
