name: Prepare and publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New stable tag matching main's application version
        type: string
        required: false
      source:
        description: Reviewed product SHA for candidates_only; otherwise resolved from the immutable tag
        type: string
        default: ''
      candidates_only:
        description: Produce fully tested candidates without drafting or packaging a release
        type: boolean
        default: false
      candidate_run:
        description: Original fully tested candidate run to verify and reuse; 0 discovers existing tested candidates
        type: string
        required: false
        default: '0'
      acceptance_run:
        description: Existing successful installed-acceptance run; revalidate asset checksums without rerunning tests
        type: string
        default: '0'
      publish_only:
        description: Publish existing tested draft bytes after release-day GPU checks; do not rebuild installers
        type: boolean
        required: false
        default: false
      gpu_evidence:
        description: JSON array of release-day Linux and macOS GPU evidence bound to installer SHA256
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: distribution-packages
  cancel-in-progress: false
env:
  RELEASE_SOURCE_FLOOR: ${{ vars.RELEASE_SOURCE_FLOOR }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.preflight.outputs.source }}
      mode: ${{ steps.preflight.outputs.mode }}
      reuse: ${{ steps.preflight.outputs.reuse }}
      candidate_run: ${{ steps.preflight.outputs.candidate_run }}
      linux_candidate_run: ${{ steps.preflight.outputs.linux_candidate_run }}
      macos_candidate_run: ${{ steps.preflight.outputs.macos_candidate_run }}
      source_floor: ${{ steps.preflight.outputs.source_floor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Resolve reviewed source and existing fully tested candidates before allocating or building
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATES_ONLY: ${{ inputs.candidates_only }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          task_args=()
          if [[ "$CANDIDATES_ONLY" == true ]]; then task_args+=(--candidates-only); fi
          if [[ "$PUBLISH_ONLY" == true ]]; then task_args+=(--publish-only); fi
          python tools/ci_release_candidates.py preflight --tag "$RELEASE_TAG" --source "$SOURCE" --candidate-run "$CANDIDATE_RUN" "${task_args[@]}"
  candidates:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.publish_only && needs.preflight.outputs.mode == 'release' && needs.preflight.outputs.reuse != 'true' }}
    permissions:
      contents: write
      actions: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/macos.yml
    with:
      source: ${{ needs.preflight.outputs.source }}
      request_id: release-${{ github.run_id }}-${{ github.run_attempt }}
      tier: release
      acceptance: full
      macos_coverage: true
    secrets: inherit
  candidate-receipt:
    needs: [preflight, candidates]
    if: ${{ !cancelled() && !inputs.publish_only && needs.preflight.result == 'success' && (needs.candidates.result == 'success' || (needs.candidates.result == 'skipped' && needs.preflight.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_run: ${{ steps.original.outputs.candidate_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify every authoritative candidate gate and its exact consumed bytes
        if: needs.preflight.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.preflight.outputs.source }}
          CANDIDATE_OUTPUTS: ${{ toJSON(needs.candidates.outputs) }}
        run: python tools/ci_release_candidates.py receipt --source "$SOURCE" --output candidate-evidence/release-candidate.json
      - name: Retain the tested index for the original successful candidate jobs
        if: needs.preflight.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-release-candidate-${{ needs.preflight.outputs.source }}
          path: candidate-evidence/release-candidate.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error
      - name: Forward original candidate evidence without claiming a new build
        if: needs.preflight.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.preflight.outputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ needs.preflight.outputs.candidate_run }}
          CANDIDATES_ONLY: ${{ inputs.candidates_only }}
        run: |
          task_args=()
          if [[ "$CANDIDATES_ONLY" == true ]]; then task_args+=(--candidates-only); fi
          python tools/ci_release_candidates.py evidence --tag "$RELEASE_TAG" --source "$SOURCE" --candidate-run "$CANDIDATE_RUN" --output candidate-evidence/original-candidate.json "${task_args[@]}"
      - name: Retain an explicit original-run evidence locator
        if: needs.preflight.outputs.reuse == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-release-evidence-${{ needs.preflight.outputs.source }}
          path: candidate-evidence/original-candidate.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error
      - id: original
        env:
          REUSE: ${{ needs.preflight.outputs.reuse }}
          ORIGINAL_RUN: ${{ needs.preflight.outputs.candidate_run }}
        run: |
          task_run=$GITHUB_RUN_ID
          if [[ "$REUSE" == true ]]; then task_run=$ORIGINAL_RUN; fi
          echo "candidate_run=$task_run" >> "$GITHUB_OUTPUT"
  prepare:
    needs: [preflight, candidates, candidate-receipt]
    if: ${{ !cancelled() && !inputs.publish_only && !inputs.candidates_only && needs.preflight.result == 'success' && needs.candidate-receipt.result == 'success' && (needs.candidates.result == 'success' || (needs.candidates.result == 'skipped' && needs.preflight.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      package_release: ${{ steps.prepare.outputs.package_release }}
      candidate_run: ${{ steps.prepare.outputs.candidate_run }}
      linux_candidate_run: ${{ steps.prepare.outputs.linux_candidate_run }}
      macos_candidate_run: ${{ steps.prepare.outputs.macos_candidate_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require tested main candidates and administrator tag, then create draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ needs.candidate-receipt.outputs.candidate_run }}
        run: python tools/prepare_release.py --tag "$RELEASE_TAG" --candidate-run "$CANDIDATE_RUN"
  linux:
    needs: prepare
    permissions:
      id-token: write
      attestations: write
      contents: write
      actions: write
    uses: ./.github/workflows/linux-packages.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      package_release: ${{ needs.prepare.outputs.package_release }}
      candidate_run: ${{ needs.prepare.outputs.linux_candidate_run }}
  macos:
    needs: prepare
    permissions:
      id-token: write
      attestations: write
      contents: write
      actions: read
    uses: ./.github/workflows/macos-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      candidate_run: ${{ needs.prepare.outputs.macos_candidate_run }}
  acceptance:
    if: ${{ !cancelled() && !inputs.candidates_only && needs.preflight.result == 'success' && (inputs.publish_only || (needs.prepare.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success')) }}
    needs: [preflight, prepare, linux, macos]
    permissions:
      # Draft release metadata/assets are visible only with push access.
      contents: write
      actions: read
    uses: ./.github/workflows/release-acceptance.yml
    with:
      tag: ${{ inputs.tag }}
      gpu_evidence: ${{ inputs.gpu_evidence }}
      acceptance_run: ${{ inputs.acceptance_run }}
  evidence:
    if: ${{ !cancelled() && !inputs.publish_only && needs.acceptance.result == 'success' }}
    needs: [prepare, linux, macos, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Re-verify and retain original T5 evidence locators
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PLATFORM_RUNS: ${{ format('{{"linux-app":{0},"macos-app":{1}}}', needs.prepare.outputs.linux_candidate_run, needs.prepare.outputs.macos_candidate_run) }}
        run: |
          python -m tools.ci_release_evidence record --tag "$TAG" --platform-runs "$PLATFORM_RUNS" --output release-evidence-v2.json --upload-index
  publish:
    timeout-minutes: 10
    if: ${{ always() && !inputs.candidates_only }}
    needs: [preflight, candidates, candidate-receipt, prepare, linux, macos, acceptance, evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-acceptance-summary-${{ needs.acceptance.outputs.summary_attempt }}
          path: acceptance-summary
      - name: Require installer-bound manual GPU evidence
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release_acceptance_report.py --tag "$TAG" --require-publication acceptance-summary/release-acceptance.json
      - name: Re-verify original candidate, packaging, attestation and acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python -m tools.ci_release_evidence verify --tag "$TAG" --publication-report acceptance-summary/release-acceptance.json
      - name: Require complete acceptance and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          CANDIDATE_REUSE: ${{ needs.preflight.outputs.reuse }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools')
          from release_acceptance_report import require_coordinator
          results = json.loads(os.environ['RESULTS'])
          require_coordinator(results, os.environ['GITHUB_REF'], os.environ['PUBLISH_ONLY'] == 'true', reuse=os.environ['CANDIDATE_REUSE'] == 'true')
          expected = 'skipped' if os.environ['PUBLISH_ONLY'] == 'true' else 'success'
          if results.get('evidence', {}).get('result') != expected:
              raise ValueError('Original T5 evidence was not verified: ' + str(results))
          PY
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/published-releases.json"
          latest=$(python3 tools/release_latest.py --tag "$TAG" --releases "$RUNNER_TEMP/published-releases.json")
          gh release edit "$TAG" --tag "$TAG" --verify-tag --draft=false --latest="$latest"
