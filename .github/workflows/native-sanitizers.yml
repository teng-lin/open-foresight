name: Native address and undefined behavior sanitizers
on:
  schedule:
    - cron: '41 5 * * *'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'native/**'
      - 'proto/**'
      - 'third_party/**'
      - 'requirements-dev.lock'
      - 'services/**'
      - 'tests/native/**'
      - 'tests/helper/**'
      - 'tests/inference/**'
      - 'tests/integration/**'
      - 'tools/generate_bindings.py'
      - 'tools/run_native_sanitizers.sh'
      - 'tools/run_thread_sanitizers.sh'
      - 'tools/verify_thread_sanitizer.py'
      - 'tools/verify_native_sanitizers.py'
      - 'tools/ci_sanitizer_artifacts.py'
      - 'tools/sanitizer_toolchain_profiles.json'
      - 'tests/test_ci_sanitizer_artifacts.py'
      - 'tools/build_sanitizer_sdk.py'
      - 'tools/sanitizer_runtime.py'
      - 'tools/sanitizer_settings.py'
      - 'tools/lsan-cpython.supp'
      - 'tests/test_sanitizer_runtime.py'
      - 'tests/test_native_leak_sanitizer.py'
      - 'tools/build_macos_sdk.py'
      - 'packaging/minimal-grpc.cmake'
      - 'packaging/sanitizer-grpc.cmake'
      - '.github/workflows/native-sanitizers.yml'
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'native/**'
      - 'proto/**'
      - 'third_party/**'
      - 'requirements-dev.lock'
      - 'services/**'
      - 'tests/native/**'
      - 'tests/helper/**'
      - 'tests/inference/**'
      - 'tests/integration/**'
      - 'tools/generate_bindings.py'
      - 'tools/run_native_sanitizers.sh'
      - 'tools/run_thread_sanitizers.sh'
      - 'tools/verify_thread_sanitizer.py'
      - 'tools/verify_native_sanitizers.py'
      - 'tools/ci_sanitizer_artifacts.py'
      - 'tools/sanitizer_toolchain_profiles.json'
      - 'tests/test_ci_sanitizer_artifacts.py'
      - 'tools/build_sanitizer_sdk.py'
      - 'tools/sanitizer_runtime.py'
      - 'tools/sanitizer_settings.py'
      - 'tools/lsan-cpython.supp'
      - 'tests/test_sanitizer_runtime.py'
      - 'tests/test_native_leak_sanitizer.py'
      - 'tools/build_macos_sdk.py'
      - 'packaging/minimal-grpc.cmake'
      - 'packaging/sanitizer-grpc.cmake'
      - '.github/workflows/native-sanitizers.yml'
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      consume_only:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      allow_sdk_build:
        type: boolean
        default: false
        description: Build only after preserved compatible prefixes are unavailable
      sdk_rebuild_reason:
        type: string
        default: ''
        description: Exact incompatible input or verified artifact gap justifying replacement
permissions:
  contents: read
  actions: read
concurrency:
  group: native-sanitizers-${{ inputs.consume_only && github.run_id || github.event_name }}-${{ github.ref }}
  # Finish and cache the instrumented SDK before validating newer PR heads.
  # Only the newest pending head waits, then reuses the compiler/recipe cache.
  cancel-in-progress: false
jobs:
  native-sanitizers:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 120
    steps:
      # The archive was checked against all 12 compiler/ABI package versions in
      # successful SDK artifact 12152408008; preserve the existing SDK inputs.
      - name: Select the verified Arch repository snapshot before compiler installation
        run: |
          cat > /etc/pacman.d/mirrorlist <<'FORESIGHT_ARCH_MIRROR'
          Server = https://archive.archlinux.org/repos/2026/10/18/$repo/os/$arch
          FORESIGHT_ARCH_MIRROR
      - name: Install the native compiler and test dependencies
        run: pacman -Syu --noconfirm cmake ninja gcc clang compiler-rt git nlohmann-json sqlite icu openssl zlib python python-pip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      - name: Trust this checked-out workspace for container Git provenance checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install artifact transport without updating compiler packages
        run: pacman -S --needed --noconfirm github-cli
      - name: Install hash-verified Python test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          .venv/bin/python -m pytest tests/test_sanitizer_runtime.py tests/test_native_leak_sanitizer.py -q
      - name: Identify the compiler for the instrumented SDK cache
        id: compiler
        run: |
          echo "version=$(clang++ -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "identity=$(clang++ --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          runtime_directory=$(python tools/sanitizer_runtime.py --directory)
          echo "LD_LIBRARY_PATH=$runtime_directory:$PWD/build/sanitizer-sdk/lib" >> "$GITHUB_ENV"
      - name: Verify the pinned address toolchain still matches the preserved SDK
        run: .venv/bin/python tools/ci_sanitizer_artifacts.py verify-environment --kind address --prefix build/sanitizer-sdk
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sdk-cache
        with:
          path: build/sanitizer-sdk
          key: sanitizer-sdk-clang-${{ steps.compiler.outputs.version }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('tools/build_sanitizer_sdk.py', 'tools/build_macos_sdk.py', 'tools/sanitizer_runtime.py', 'packaging/minimal-grpc.cmake', 'packaging/sanitizer-grpc.cmake') }}
      - name: Recover or qualify the installed address SDK before any build
        id: sdk-qualification
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_PR: ${{ github.event.pull_request.number || 0 }}
          CACHE_KEY: ${{ steps.sdk-cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
          ALLOW_BUILD: ${{ !inputs.consume_only && github.event_name == 'workflow_dispatch' && inputs.allow_sdk_build }}
          REBUILD_REASON: ${{ inputs.sdk_rebuild_reason }}
        run: |
          args=()
          if [[ "$ALLOW_BUILD" == true ]]; then args+=(--allow-build --reason "$REBUILD_REASON"); fi
          .venv/bin/python tools/ci_sanitizer_artifacts.py restore --kind address \
            --prefix build/sanitizer-sdk --own-pr "$OWN_PR" --cache-key "$CACHE_KEY" --cache-hit "$CACHE_HIT" "${args[@]}"
      - name: Build the pinned instrumented gRPC and protobuf closure
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        run: python tools/build_sanitizer_sdk.py --jobs 2
      - name: Save the validated SDK before application checks
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/sanitizer-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Archive the verified installed address SDK without rebuilding
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        id: sdk-artifact
        run: .venv/bin/python tools/ci_sanitizer_artifacts.py pack --kind address --prefix build/sanitizer-sdk --output build/sanitizer-sdk-artifact
      - name: Share the installed address SDK independently of branch-scoped caches
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.sdk-artifact.outputs.artifact_name }}
          overwrite: true
          path: |
            build/sanitizer-sdk-artifact/identity.json
            build/sanitizer-sdk-artifact/payload.tar.gz
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Install application-only PipeWire development files
        run: pacman -S --needed --noconfirm pkgconf pipewire
      # Leak detection stays off only for build-time tools; every test and
      # probe below gets LeakSanitizer from tools/sanitizer_settings.py.
      - name: Configure and build instrumented native code and tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DFORESIGHT_SANITIZERS=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/build/sanitizer-sdk" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build/sanitizers --parallel 2
      - name: Prove ASan, UBSan and LSan detect real faults through the gate settings
        run: python tools/verify_native_sanitizers.py --compiler clang++ --python "$PWD/.venv/bin/python" --output test-results/sanitizer-probes
      - name: Run every native test with fatal ASan, LSan and UBSan reports
        run: tools/run_native_sanitizers.sh build/sanitizers test-results/sanitizers
      - name: Retain sanitizer diagnostics and native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sanitizer-evidence
          overwrite: true
          path: |
            test-results/sanitizers/
            test-results/sanitizer-probes/
            build/sanitizers/Testing/
          if-no-files-found: warn
  thread-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      probation: ${{ steps.policy.outputs.probation }}
    steps:
      - id: policy
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          probation = datetime.now(timezone.utc) < datetime(2026, 10, 25, tzinfo=timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('probation=' + str(probation).lower(), file=output)
          PY
  native-thread-sanitizer:
    needs: thread-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: ${{ !inputs.consume_only && github.event_name != 'schedule' && needs.thread-policy.outputs.probation == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      # All 65 recorded compiler/ABI package versions from successful SDK
      # artifact 12152850851 are available in this immutable Ubuntu snapshot.
      - name: Select the verified Ubuntu repository snapshot before compiler installation
        run: |
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://snapshot.ubuntu.com/ubuntu/20261018T210000Z/' \
            'Suites: noble noble-updates noble-security' \
            'Components: main universe' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/foresight-sanitizer.sources
          printf '%s\n' \
            'Dir::Etc::sourcelist "/etc/apt/foresight-sanitizer.sources";' \
            'Dir::Etc::sourceparts "-";' \
            | sudo tee /etc/apt/apt.conf.d/50foresight-sanitizer-snapshot
      - name: Install the separate TSan toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev cmake ninja-build libssl-dev zlib1g-dev libsqlite3-dev libicu-dev nlohmann-json3-dev python3-venv
          sudo sysctl vm.mmap_rnd_bits=28
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - name: Identify the TSan compiler and runtime
        id: compiler
        run: |
          echo "identity=$(clang++ --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          runtime=$(python3 tools/sanitizer_runtime.py --kind thread --directory)
          echo "LD_LIBRARY_PATH=$runtime:$PWD/build/thread-sdk/lib" >> "$GITHUB_ENV"
      - name: Verify the pinned thread toolchain still matches the preserved SDK
        run: .venv/bin/python tools/ci_sanitizer_artifacts.py verify-environment --kind thread --prefix build/thread-sdk
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: thread-cache
        with:
          path: build/thread-sdk
          key: thread-sdk-${{ steps.compiler.outputs.identity }}-${{ hashFiles('tools/build_sanitizer_sdk.py', 'tools/build_macos_sdk.py', 'tools/sanitizer_runtime.py', 'packaging/minimal-grpc.cmake', 'packaging/sanitizer-grpc.cmake') }}
      - name: Prove ThreadSanitizer observes an actual race
        run: python3 tools/verify_thread_sanitizer.py --output test-results/thread-probe
      - name: Recover or qualify the installed thread SDK before any build
        id: sdk-qualification
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_PR: ${{ github.event.pull_request.number || 0 }}
          CACHE_KEY: ${{ steps.thread-cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.thread-cache.outputs.cache-hit }}
          ALLOW_BUILD: ${{ !inputs.consume_only && github.event_name == 'workflow_dispatch' && inputs.allow_sdk_build }}
          REBUILD_REASON: ${{ inputs.sdk_rebuild_reason }}
        run: |
          args=()
          if [[ "$ALLOW_BUILD" == true ]]; then args+=(--allow-build --reason "$REBUILD_REASON"); fi
          .venv/bin/python tools/ci_sanitizer_artifacts.py restore --kind thread \
            --prefix build/thread-sdk --own-pr "$OWN_PR" --cache-key "$CACHE_KEY" --cache-hit "$CACHE_HIT" "${args[@]}"
      - name: Build the separately instrumented TSan SDK
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        run: python3 tools/build_sanitizer_sdk.py --sanitizer thread --prefix build/thread-sdk --sources build/thread-sdk-sources --jobs 2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' && steps.thread-cache.outputs.cache-hit != 'true' }}
        with:
          path: build/thread-sdk
          key: ${{ steps.thread-cache.outputs.cache-primary-key }}
      - name: Archive the verified installed thread SDK without rebuilding
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        id: sdk-artifact
        run: .venv/bin/python tools/ci_sanitizer_artifacts.py pack --kind thread --prefix build/thread-sdk --output build/thread-sdk-artifact
      - name: Share the installed thread SDK independently of branch-scoped caches
        if: ${{ !inputs.consume_only && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.sdk-artifact.outputs.artifact_name }}
          overwrite: true
          path: |
            build/thread-sdk-artifact/identity.json
            build/thread-sdk-artifact/payload.tar.gz
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Install application-only PipeWire development files
        run: sudo apt-get install -y --no-install-recommends pkg-config libpipewire-0.3-dev
      - name: Configure and build native and helper TSan tests
        run: |
          cmake -S . -B build/thread -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DFORESIGHT_THREAD_SANITIZER=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/build/thread-sdk" -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build/thread --parallel 2
      - name: Run native and helper tests with fatal race reports
        run: tools/run_thread_sanitizers.sh build/thread test-results/thread
      - name: Retain TSan reports for probation triage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thread-sanitizer-evidence
          overwrite: true
          path: |
            test-results/thread/
            test-results/thread-probe/
            build/thread/Testing/
          if-no-files-found: warn
