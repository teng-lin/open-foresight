name: RPC contracts
'on':
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned protobuf toolchain
        run: |
          curl --fail --location --retry 3 -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          echo '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  /tmp/protoc.zip' | sha256sum --check
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo '/tmp/protoc/bin' >> "$GITHUB_PATH"
          dart pub global activate protoc_plugin 24.0.0
          python -m pip install protobuf==6.33.5 pytest
      - name: Verify protobuf shape and generated Dart drift
        run: |
          python tools/check_dart_bindings.py
          python -m pytest tests/contracts/test_descriptor.py tests/contracts/test_owned_descriptors.py
      - name: Check registry, exhaustive dispatch, facades and every MCP tool
        working-directory: packages/foresight_core
        run: |
          dart pub get
          dart analyze
          dart test test/operation_registry_test.dart test/rpc_error_test.dart test/mcp_protocol_test.dart
