name: macOS release DMG
env:
  RELEASE_SOURCE_FLOOR: ${{ vars.RELEASE_SOURCE_FLOOR }}
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      formats: ${{ steps.plan.outputs.formats }}
      source: ${{ steps.plan.outputs.source }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Inspect existing DMG before allocating a Mac runner
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: python -m tools.release_inputs --tag "$RELEASE_TAG" --formats dmg
  build:
    needs: plan
    if: needs.plan.outputs.formats != '[]'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require tag version and retrieve the exact tested app
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN: ${{ inputs.candidate_run }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |-
        source=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
        python tools/ci_artifacts.py pull --consumer release-preparation --component macos-app --identity "$source" --prefix artifacts --wait 0 --run-id "$CANDIDATE_RUN"
        mkdir -p staging test-results
        ditto -x -k artifacts/Open-Foresight-macos-arm64.zip staging
        codesign --verify --deep --strict 'staging/Open Foresight.app'
        python tools/verify_macos_release_runtime.py 'staging/Open Foresight.app' --output test-results/runtime.json
        python - <<'PY'
        from pathlib import Path
        from tools.google_client_release import release_google_client
        release_google_client(Path('staging/Open Foresight.app/Contents/Resources/google-client.json'), required=True)
        PY
    - name: Run real release-model CPU acceptance
      run: python tools/test_macos_release_models.py 'staging/Open Foresight.app' --models build/release-acceptance-models
        --output test-results/release-models
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-macos-arm64-3.35.7-v1
    - name: Install pinned Dart for live release distribution acceptance
      run: |-
        if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        fi
        test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/flutter/bin/dart" --version
    - name: Verify Google sign-in from the promoted bundle
      run: |-
        task_resources="$PWD/staging/Open Foresight.app/Contents/Resources"
        (cd packages/foresight_core && dart pub get --enforce-lockfile && env -u FORESIGHT_GOOGLE_CLIENT_JSON \
          FORESIGHT_RESOURCES="$task_resources" dart run tool/verify_google_configuration.dart) > test-results/google-configuration.json
    - name: Validate cloud distribution from the promoted bundle
      run: |-
        task_resources="$PWD/staging/Open Foresight.app/Contents/Resources"
        python - <<'PY'
        import json
        from pathlib import Path
        config=json.loads(Path('staging/Open Foresight.app/Contents/Resources/runtime.json').read_text())
        present=[bool(config.get(k)) for k in ('FORESIGHT_SEARCH_API_KEY','FORESIGHT_WEB_CONTENT_API_KEY')]
        if any(present) and not all(present): raise SystemExit('Incomplete bundled distribution configuration')
        Path('test-results/cloud-enabled').write_text(str(all(present)))
        PY
        if [[ "$(cat test-results/cloud-enabled)" == True ]]; then
          (cd packages/foresight_core && dart pub get --enforce-lockfile && env -u FORESIGHT_SEARCH_API_KEY -u FORESIGHT_WEB_CONTENT_API_KEY FORESIGHT_RESOURCES="$task_resources" dart run tool/verify_cloud_services.dart --download-query) > test-results/cloud-distribution.json
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-release-application
        overwrite: true
        path: artifacts/
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-release-promotion-evidence
        overwrite: true
        path: test-results/
        retention-days: 30
  dmg:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: macos-release-application
        path: artifacts
    - name: Restore tested application and create disk image
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        python3 -m tools.release_upload --tag "$RELEASE_TAG" --require-missing-dmg
        mkdir -p staging dist
        ditto -x -k artifacts/Open-Foresight-macos-arm64.zip staging
        codesign --verify --deep --strict --verbose=2 'staging/Open Foresight.app'
        python3 tools/verify_macos_release_runtime.py 'staging/Open Foresight.app' \
          --output dist/runtime-verification.json
        python3 tools/create_dmg.py --app 'staging/Open Foresight.app' \
          --manifest 'artifacts/Open Foresight.manifest.json' \
          --name "Open-Foresight-${RELEASE_TAG}-macos-arm64.dmg" --output dist
    - name: Generate installer SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        path: staging/Open Foresight.app
        syft-version: v1.33.0
        format: spdx-json
        output-file: ${{ runner.temp }}/installer.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Attest installer provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: dist/*.dmg
    - name: Attest installer SBOM
      uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
      with:
        subject-path: dist/*.dmg
        sbom-path: ${{ runner.temp }}/installer.spdx.json
    - name: Bind the DMG to its original verified candidate
      run: |
        task_installers=(dist/*.dmg)
        test "${#task_installers[@]}" = 1
        python3 -m tools.ci_release_evidence package --tag "$RELEASE_TAG" --format dmg --directory artifacts --installer "${task_installers[0]}" --output test-results/package-receipt.json
    - name: Retain original installer packaging receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-packaging-dmg
        path: test-results/package-receipt.json
        overwrite: true
        if-no-files-found: error
        retention-days: 90
    - name: Retain disk image and provenance
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: open-foresight-macos-arm64-dmg
        overwrite: true
        path: dist/
        if-no-files-found: error
        retention-days: 90
    - name: Attach disk image to release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
        python3 -m tools.release_upload --tag "$RELEASE_TAG" dist/*
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished stable tag
        required: true
        type: string
      candidate_run:
        description: Existing verified macOS application candidate run
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_run:
        type: string
        default: "0"
      tag:
        required: true
        type: string
