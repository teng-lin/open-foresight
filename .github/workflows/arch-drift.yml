name: Arch Linux rolling drift
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # Temporary rollout probe; remove after a green hosted own-path PR run.
  pull_request:
    paths:
      - '.github/workflows/arch-drift.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: arch-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  FORESIGHT_FLUTTER_EXECUTABLE: /opt/foresight-flutter/bin/flutter
  # Keep Core's child-VM deadlines independent of Desktop's compiler load.
  FORESIGHT_PARALLEL_GATES: '0'
  FORESIGHT_REQUIRE_DART_GATES: '1'
  FORESIGHT_BUILD_JOBS: '2'
  FORESIGHT_COVERAGE: '1'
  FORESIGHT_CORE_COVERAGE_MIN: '90'
  LIBGL_ALWAYS_SOFTWARE: '1'
  FORESIGHT_LINUX_UI_TEST: '1'
  FORESIGHT_REQUIRE_NATIVE_UI_TEST: '1'
jobs:
  arch:
    name: Arch Linux checks / full build and tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 120
    steps:
      - name: Install the rolling Arch application toolchain
        run: pacman -Syu --needed --noconfirm git cmake ninja gcc grpc protobuf nlohmann-json sqlite python python-pip uv clang gtk3 pkgconf pipewire unzip xz mesa libglvnd xorg-server-xvfb xorg-xauth dbus poppler unrtf bubblewrap which github-cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Trust only the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Descriptor audits use the reviewed compiler; C++ bindings still use
      # protobuf::protoc paired with the rolling system Protobuf library.
      - name: Install pinned descriptor compiler
        run: |
          task_protoc="$RUNNER_TEMP/descriptor-protoc"
          curl --fail --location --retry 3 --max-time 120 -o "$task_protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          printf '%s  %s\n' '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7' "$task_protoc.zip" | sha256sum --check
          unzip -q "$task_protoc.zip" -d "$task_protoc"
          test "$("$task_protoc/bin/protoc" --version)" = 'libprotoc 35.1'
          echo "$task_protoc/bin" >> "$GITHUB_PATH"
      - name: Record the actual compiler and package drift before building
        run: |
          mkdir -p test-results/arch
          pacman -Q > test-results/arch/packages.txt
          gcc --version > test-results/arch/compiler.txt
          {
            echo 'Arch drift intentionally tests the current distribution compiler and system gRPC/protobuf.'
            echo 'No dependency SDK build is permitted; compatible Flutter and package downloads are restored below.'
            echo 'The package inventory and compiler identity are retained with this run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install hash-verified Python test tools
        env:
          UV_PYTHON_INSTALL_DIR: /opt/foresight-python
        run: |
          # Keep tooling on required Python 3.13 while Arch's compiler rolls.
          uv python install 3.13
          task_python=$(uv python find --managed-python 3.13)
          "$task_python" -m venv .venv
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /opt/foresight-flutter
          key: flutter-linux-x64-3.35.7-ui-v2
          restore-keys: |
            flutter-linux-x64-3.35.7-ui-
            flutter-linux-x64-3.35.7-v1
            flutter-linux-x64-3.35.7-
      - name: Verify the pinned Flutter SDK
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /opt/foresight-flutter
        run: |
          if [[ ! -x /opt/foresight-flutter/bin/flutter ]]; then
            git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git /opt/foresight-flutter
          fi
          test "$(git -C /opt/foresight-flutter rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo /opt/foresight-flutter/bin >> "$GITHUB_PATH"
          /opt/foresight-flutter/bin/flutter config --enable-linux-desktop --no-analytics
          /opt/foresight-flutter/bin/flutter precache --linux
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.cache/foresight-pub" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/.cache/foresight-pub
          key: pub-linux-ui-v2-${{ hashFiles('packages/foresight_core/pubspec.lock', 'apps/desktop/pubspec.lock') }}
          restore-keys: |
            pub-linux-ui-v2-
            pub-linux-
      - name: Run every Linux host Python contract
        run: .venv/bin/python tools/platform_python_tests.py --platform linux
      - name: Restore verified compatible native compiler work
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          .venv/bin/python tools/ci_native_work.py --own-pr "$OWN_PR" \
            --output test-results/arch/native-work.json -- -G Ninja
      - name: Build and test with the current Arch toolchain
        env:
          FORESIGHT_CORE_TEST_CONCURRENCY: '2'
        run: |
          .venv/bin/python tools/run_ci_user.py --workspace "$GITHUB_WORKSPACE" -- \
            .venv/bin/python tools/run_media_test_gate.py \
            --cache build/media-test-cache --output test-results/arch/media-worker \
            --fetch -- xvfb-run -a dbus-run-session -- bash tools/build.sh --platform linux -G Ninja
      - name: Record actual scheduled retained Arch closure after validation
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: .venv/bin/python -m tools.ci_rollout --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --producer-job arch --output build/qualification/qualification.json
      - name: Retain original scheduled Arch qualification
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-rollout-qualification
          path: build/qualification/qualification.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Retain drift diagnostics and suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch-drift-evidence
          overwrite: true
          path: |
            test-results/
            coverage/
            build/media-test-cache/**/build.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  drift-issue:
    needs: arch
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: ci-arch-drift-issue
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Track daily toolchain drift independently of commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_drift_issue.py arch-drift.yml
