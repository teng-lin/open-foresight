name: Published installer acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to audit
        required: true
        type: string
      gpu_evidence:
        description: Installer-bound release-day GPU evidence JSON
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      gpu_evidence:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: published-acceptance-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Read unpublished draft metadata before publication.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Acceptance tooling follows the reviewed coordinator; installers
          # remain independently pinned to the immutable product tag.
          ref: ${{ github.sha }}
      - name: Require all installers before acceptance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYCODE'
          import os, re, sys
          sys.path.insert(0, 'tools')
          from release_asset_acceptance import select_asset
          from github_release import release_for_tag
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise ValueError('An explicit stable release tag is required')
          release = release_for_tag(os.environ['GITHUB_REPOSITORY'], tag)
          for kind in ('deb', 'rpm', 'arch', 'dmg'):
              select_asset(release, kind)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nready=true\n')
          PYCODE

  linux:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Read draft metadata and download unpublished assets.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu-24.04, image: 'ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac', format: deb}
          - {name: debian-13, image: 'debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5', format: deb}
          - {name: fedora-44, image: 'fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80', format: rpm}
          - {name: arch-rolling, image: 'archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1', format: arch}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download and verify the published installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          FORMAT: ${{ matrix.format }}
        run: python tools/release_asset_acceptance.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --format "$FORMAT" --directory assets --allow-draft
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: models-cache
        with:
          path: build/acceptance-models
          key: release-acceptance-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare authenticated public model fixtures
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Cache authenticated model fixtures before application tests
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/acceptance-models
          key: release-acceptance-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Install and exercise the downloaded package as an ordinary user
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p reports
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined -e OPEN_FORESIGHT_ACCEPTANCE_DISPOSABLE=1 \
            -v "$PWD:/work:ro" -v "$PWD/assets:/assets:ro" \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/reports:/reports" \
            "$IMAGE" bash /work/packaging/ci/test-release-package.sh "$FORMAT"
      - name: Retain installer identity and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-acceptance-${{ matrix.name }}
          path: |
            assets/installer.json
            reports/
          if-no-files-found: warn
          retention-days: 30

  macos:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: macos-15
    permissions:
      contents: write # Read draft metadata and download unpublished assets.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download and verify the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python tools/release_asset_acceptance.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --format dmg --directory assets --allow-draft
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: models-cache
        with:
          path: build/acceptance-models
          key: release-acceptance-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare authenticated public model fixtures
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Cache authenticated model fixtures before application tests
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/acceptance-models
          key: release-acceptance-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Mount DMG, install, run functional tests, reinstall and remove owned copy
        run: |
          task_dmg=(assets/*.dmg)
          test "${#task_dmg[@]}" = 1
          python tools/test_release_dmg.py --dmg "${task_dmg[0]}" \
            --destination '/Applications/Open Foresight.app' \
            --models build/acceptance-models --output reports
      - name: Retain installer identity and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-acceptance-macos-15-arm64
          path: |
            assets/installer.json
            reports/
          if-no-files-found: warn
          retention-days: 30

  acceptance:
    timeout-minutes: 5
    if: always()
    needs: [release, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every installer test to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if any(results.get(job, {}).get('result') != 'success' for job in ('release', 'linux', 'macos')):
              raise SystemExit('Installer acceptance failed or was skipped: ' + str(results))
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: published-acceptance-*
          path: acceptance-evidence
      - name: Bind automated acceptance and release-day GPU evidence
        env:
          TAG: ${{ inputs.tag }}
          GPU_EVIDENCE: ${{ inputs.gpu_evidence }}
        run: python3 tools/release_acceptance_report.py --tag "$TAG" --directory acceptance-evidence --output release-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-acceptance-summary
          path: release-acceptance.json
          if-no-files-found: error
