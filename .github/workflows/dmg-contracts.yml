name: Apple DMG contracts
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Package, mount, execute and upgrade signed fixtures
        run: python3 tools/run_dmg_contracts.py
      - name: Retain fresh Apple contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dmg-contract-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/dmg/
          if-no-files-found: error
