name: Apple DMG contracts
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Package, mount, execute and upgrade signed fixtures
        run: python3 tools/run_dmg_contracts.py
      - name: Retain fresh Apple contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dmg-contract-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/dmg/
          if-no-files-found: error
