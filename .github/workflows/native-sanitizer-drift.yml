name: Native sanitizer drift issue
on:
  workflow_run:
    workflows: [Native address and undefined behavior sanitizers]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-sanitizers-issue
  cancel-in-progress: false
jobs:
  drift-issue:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Execute reviewed coordinator code, never the triggering run's source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconcile actual main sanitizer jobs using their original API identity
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ github.event.workflow_run.id }}
          ORIGINAL_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 tools/ci_drift_issue.py native-sanitizers.yml
          --run-id "$ORIGINAL_RUN" --source "$ORIGINAL_SOURCE"
