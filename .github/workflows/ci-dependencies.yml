        if [[ -f build/shared-descriptor/image.json ]]; then
          python - <<'PY'
        import json,os,re
        image=json.load(open('build/shared-descriptor/image.json'))['image']
        if not re.fullmatch(r'ghcr.io/[a-z0-9/_.-]+@sha256:[a-f0-9]{64}', image): raise ValueError('Unpinned SDK component')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('image='+image, file=output)
        PY
        fi
      env:
        OWN_PR: ${{ github.event.pull_request.number || github.sha }}
    - name: Verify publication permission before compiling
      run: |-
        docker buildx build --push --tag "${{ steps.tag.outputs.image }}-publish-check"   --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" - <<'DOCKERFILE'
        FROM scratch
        LABEL org.opencontainers.image.description="Dependency publication permission check"
        DOCKERFILE
      if: steps.shared.outputs.hit != 'true'
    - name: Inspect immutable dependency image
      id: lookup
      run: python tools/ci_registry.py "${{ steps.tag.outputs.image }}"
    - name: Build and publish whisper
      if: steps.lookup.outputs.build == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/sdk-whisper.Dockerfile
        push: true
        tags: ${{ steps.tag.outputs.image }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        build-args: CORE_IMAGE=${{ needs.core.outputs.image }}
        cache-from: type=registry,ref=${{ steps.tag.outputs.cache }}
        cache-to: type=registry,ref=${{ steps.tag.outputs.cache }},mode=max,image-manifest=true
    - name: Resolve immutable component digest
      id: resolved
      run: python tools/ci_registry.py "${{ steps.tag.outputs.image }}" --require
    - name: Publish qualified SDK descriptor
      env:
        SDK_IMAGE: ${{ steps.resolved.outputs.image }}
      run: |-
        mkdir -p build/sdk-descriptor
        python - <<'PY'
        import json,os
        from pathlib import Path
        Path('build/sdk-descriptor/image.json').write_text(json.dumps({'image': os.environ['SDK_IMAGE']}))
        PY
        python tools/ci_artifacts.py pack --component "linux-$COMPONENT" --identity "$IDENTITY" --prefix build/sdk-descriptor --output build/published
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-linux-whisper-${{ env.IDENTITY }}
        path: build/published/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
  sdk:
    name: Assemble Linux SDK
    needs:
    - plan
    - core
    - litert
    - whisper
