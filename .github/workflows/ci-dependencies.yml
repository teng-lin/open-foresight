    outputs:
      image: ${{ steps.resolved.outputs.image }}
    env:
      COMPONENT: sdk
      IDENTITY: ${{ needs.plan.outputs['linux-sdk'] }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
