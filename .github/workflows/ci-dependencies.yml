name: Reusable CI dependencies
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/ci-dependencies.yml
    - tools/ci_artifacts.py
    - tools/pins.json
    - tools/ci_registry.py
    - tools/build_linux_sdk_local.sh
    - tools/linux_sdk_artifacts.py
    - tools/ci_verify_dependency.py
    - tools/build_macos_sdk.py
    - tools/build_macos_runtimes.py
    - tools/build_macos_vendor.py
    - tools/build_litert_extensions.py
    - tools/litert_extensions.py
    - tools/test_litert_status_abi.py
    - tools/build_whisper_vulkan.py
    - packaging/sdk*.Dockerfile
    - packaging/minimal-grpc.cmake
    - requirements-dev.lock
    - requirements-litert.lock
    - services/speech/**
    - services/inference/persistent_worker.h
    - services/inference/output_budget.h
    - services/inference/worker_frame.h
    - third_party/litert_lm/**
  workflow_dispatch: {}
  schedule:
  - cron: 19 3 1 * *
  pull_request:
    paths:
    - native/**
    - services/inference/**
    - services/helper/**
    - tools/integration_gates.py
    - tools/test_macos_release_models.py
    - tools/model_pins.py
    - apps/desktop/**
    - packages/foresight_core/**
    - packaging/**
    - .github/workflows/linux-packages.yml
    - .github/workflows/integration-acceptance.yml
    - .github/workflows/ci-dependencies.yml
    - tools/ci_artifacts.py
    - tools/pins.json
    - tools/ci_registry.py
    - tools/build_linux_sdk_local.sh
    - tools/linux_sdk_artifacts.py
    - tools/ci_verify_dependency.py
    - tools/build_macos_sdk.py
    - tools/build_macos_runtimes.py
    - tools/build_macos_vendor.py
    - tools/build_litert_extensions.py
    - tools/litert_extensions.py
    - tools/test_litert_status_abi.py
    - tools/build_whisper_vulkan.py
    - packaging/sdk*.Dockerfile
    - packaging/minimal-grpc.cmake
    - requirements-dev.lock
    - requirements-litert.lock
    - services/speech/**
    - services/inference/persistent_worker.h
    - services/inference/output_budget.h
    - services/inference/worker_frame.h
    - third_party/litert_lm/**
permissions:
  contents: read
  actions: read
jobs:
  snapshot-update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Advance the reviewed Ubuntu snapshot proposal
      run: python3 tools/update_ubuntu_snapshot.py --snapshot "$(date -u +%Y%m%dT000000Z)"
    - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
      with:
        branch: maintenance/ubuntu-snapshot
        title: Update the reviewed Ubuntu build snapshot
        commit-message: Advance the Ubuntu build snapshot for review
        body: Updates the Ubuntu SDK and application build snapshot; package and integration gates must pass before merge.
        draft: true
        add-paths: |
          tools/pins.json
          packaging/*.Dockerfile
  plan:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      macos-sdk: ${{ steps.keys.outputs['macos-sdk'] }}
      macos-runtime: ${{ steps.keys.outputs['macos-runtime'] }}
      macos-vendor: ${{ steps.keys.outputs['macos-vendor'] }}
      linux-core: ${{ steps.keys.outputs['linux-core'] }}
      linux-litert: ${{ steps.keys.outputs['linux-litert'] }}
      linux-whisper: ${{ steps.keys.outputs['linux-whisper'] }}
      linux-sdk: ${{ steps.keys.outputs['linux-sdk'] }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Compute component identities
      id: keys
      run: python tools/ci_artifacts.py keys
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
  macos:
    name: Build macOS ${{ matrix.component }}
    needs: plan
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component:
        - sdk
    concurrency:
      group: dependency-macos-${{ matrix.component }}-${{ needs.plan.outputs[format('macos-{0}', matrix.component)] }}-${{
        github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
      cancel-in-progress: false
    env:
      COMPONENT: ${{ matrix.component }}
      IDENTITY: ${{ needs.plan.outputs[format('macos-{0}', matrix.component)] }}
      PREFIX: ${{ matrix.component == 'sdk' && 'build/sdk' || 'build/macos-runtimes' }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Probe the qualified original before allocating build resources
      id: probe
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
      run: python tools/ci_artifacts.py probe --component "macos-${COMPONENT}" --identity "$IDENTITY" --own-head "$OWN_HEAD"
        --own-pr "$OWN_PR"
    - name: Install compiler tools
      run: brew install cmake ninja git-lfs
      if: steps.probe.outputs.hit != 'true'
    - name: Install verifier dependencies
      run: |-
        python -m venv .venv
        .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      if: steps.probe.outputs.hit != 'true'
    - name: Restore an already verified shared prefix
      id: shared
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
      run: |-
        if python tools/ci_artifacts.py pull --component "macos-${COMPONENT}" --prefix "$PREFIX" --optional --own-head "$OWN_HEAD" --own-pr "$OWN_PR"; then
          echo 'hit=true' >> "$GITHUB_OUTPUT"
        else
          task_result=$?
          test "$task_result" = 4
          echo 'hit=false' >> "$GITHUB_OUTPUT"
        fi
      if: steps.probe.outputs.hit != 'true'
    - name: Bootstrap from existing sdk cache
      if: steps.probe.outputs.hit != 'true' && (matrix.component == 'sdk' && steps.shared.outputs.hit != 'true')
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: build/sdk
        key: macos15-arm64-sdk-${{ hashFiles('tools/build_macos_sdk.py') }}
    - name: Build or verify SDK
      if: steps.probe.outputs.hit != 'true' && (matrix.component == 'sdk')
      run: .venv/bin/python tools/build_macos_sdk.py --jobs 3
    - name: Verify and archive the qualified prefix
      run: |-
        python tools/ci_verify_dependency.py --component "macos-${COMPONENT}" --prefix "$PREFIX"
        python tools/ci_artifacts.py pack --component "macos-${COMPONENT}" --identity "$IDENTITY" --prefix "$PREFIX" --output build/published
      if: steps.probe.outputs.hit != 'true'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-macos-${{ matrix.component }}-${{ env.IDENTITY }}
        path: build/published/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
      id: payload
      if: steps.probe.outputs.hit != 'true'
    - name: Bind the original payload upload to a small cache receipt
      env:
        GH_TOKEN: ${{ github.token }}
      run: python tools/ci_artifacts.py publish-receipt --component "macos-${COMPONENT}" --identity "$IDENTITY" --prefix
        build/published --artifact-id "${{ steps.payload.outputs.artifact-id }}" --output build/receipt
      if: steps.probe.outputs.hit != 'true'
    - name: Retain small cache receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: receipt-ci-macos-${{ env.COMPONENT }}-${{ env.IDENTITY }}
        path: build/receipt/
        retention-days: 90
        overwrite: true
        if-no-files-found: error
        compression-level: 0
      if: steps.probe.outputs.hit != 'true'
  core:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Build Linux core
    needs:
    - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read
    concurrency:
      group: dependency-linux-core-${{ needs.plan.outputs['linux-core'] }}-${{ github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || 'trusted' }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.resolved.outputs.image }}
    env:
      COMPONENT: core
      IDENTITY: ${{ needs.plan.outputs['linux-core'] }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Free hosted-runner space for retained image promotion
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Authenticate SDK registry
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Reuse a qualified component from reviewed sources
      if: github.event_name != 'schedule'
      id: shared
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
      run: |-
        if python tools/ci_artifacts.py pull --component "linux-$COMPONENT" --prefix build/shared-descriptor --optional --own-head "$OWN_HEAD" --own-pr "$OWN_PR"; then
          echo 'hit=true' >> "$GITHUB_OUTPUT"
        else
          task_result=$?
          test "$task_result" = 4
          echo 'hit=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Resolve component image namespace
      id: tag
      run: |-
        task_repository=${GITHUB_REPOSITORY,,}
        task_namespace="ghcr.io/$task_repository"
        if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
          IDENTITY="$IDENTITY-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        fi
        echo "image=$task_namespace/linux-$COMPONENT:$IDENTITY" >> "$GITHUB_OUTPUT"
        echo "cache=$task_namespace/linux-$COMPONENT:buildcache" >> "$GITHUB_OUTPUT"
        if [[ -f build/shared-descriptor/image.json ]]; then
          python tools/linux_sdk_artifacts.py promote --component "linux-$COMPONENT" --prefix build/shared-descriptor --tag "$task_namespace/linux-$COMPONENT:$IDENTITY" --discard-archive
        fi
      env:
        OWN_PR: ${{ github.event.pull_request.number || github.sha }}
    - name: Verify publication permission before compiling
      run: |-
        docker buildx build --push --tag "${{ steps.tag.outputs.image }}-publish-check"   --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" - <<'DOCKERFILE'
        FROM scratch
        LABEL org.opencontainers.image.description="Dependency publication permission check"
        DOCKERFILE
      if: steps.shared.outputs.hit != 'true'
    - name: Inspect immutable dependency image
      id: lookup
      run: python tools/ci_registry.py "${{ steps.tag.outputs.image }}"
    - name: Build and publish core
      if: steps.lookup.outputs.build == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/sdk-core.Dockerfile
        push: true
        no-cache: ${{ github.event_name == 'schedule' }}
        pull: true
        tags: ${{ steps.tag.outputs.image }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        build-args: ''
        cache-from: type=registry,ref=${{ steps.tag.outputs.cache }}
        cache-to: type=registry,ref=${{ steps.tag.outputs.cache }},mode=max,image-manifest=true
    - name: Resolve immutable component digest
      id: resolved
      run: python tools/ci_registry.py "${{ steps.tag.outputs.image }}" --require
    - name: Publish qualified SDK descriptor
      env:
        SDK_IMAGE: ${{ steps.resolved.outputs.image }}
      run: |-
        mkdir -p build/sdk-descriptor
        python - <<'PY'
        import json,os
        from pathlib import Path
        Path('build/sdk-descriptor/image.json').write_text(json.dumps({'image': os.environ['SDK_IMAGE']}))
        PY
        python tools/ci_artifacts.py pack --component "linux-$COMPONENT" --identity "$IDENTITY" --prefix build/sdk-descriptor --output build/published
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-linux-core-${{ env.IDENTITY }}
        path: build/published/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
      id: payload
    - name: Bind the original payload upload to a small cache receipt
      env:
        GH_TOKEN: ${{ github.token }}
      run: python tools/ci_artifacts.py publish-receipt --component "linux-${COMPONENT}" --identity "$IDENTITY" --prefix
        build/published --artifact-id "${{ steps.payload.outputs.artifact-id }}" --output build/receipt
    - name: Retain small cache receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: receipt-ci-linux-${{ env.COMPONENT }}-${{ env.IDENTITY }}
        path: build/receipt/
        retention-days: 90
        overwrite: true
        if-no-files-found: error
        compression-level: 0
  litert:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Build Linux litert
    needs:
    - plan
    - core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read
    concurrency:
      group: dependency-linux-litert-${{ needs.plan.outputs['linux-litert'] }}-${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.resolved.outputs.image }}
    env:
      COMPONENT: litert
      IDENTITY: ${{ needs.plan.outputs['linux-litert'] }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Free hosted-runner space for retained image promotion
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Authenticate SDK registry
      env:
