name: Publish Linux application caches
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-application-cache-publish
  cancel-in-progress: false
jobs:
  publish-linux-caches:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require current reviewed main before cache work
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/linux-cache-publish.yml@refs/heads/main"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate the dedicated main cache publisher
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Restore qualified SDK outputs without a local SDK build fallback
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        CI_TIER: sweep
      run: python3 tools/ci_linux_shadow_sdk.py --source "$GITHUB_SHA" --own-pr 0 --directory build/cache-sdk
    - name: Recheck current main immediately before registry writes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
    - name: Publish only secret-free dependency and acceptance caches
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
      run: bash tools/publish_linux_ci_caches.sh
