name: Publish Linux application caches
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_consumers:
        description: Run fresh application consumers and record publisher qualification
        type: boolean
        default: false
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.source.outputs.current }}
      common: ${{ steps.source.outputs.common }}
      registry_needed: ${{ steps.source.outputs.registry_needed }}
      formatter: ${{ steps.source.outputs.formatter }}
      document: ${{ steps.source.outputs.document }}
      models_linux: ${{ steps.source.outputs.models_linux }}
      models_macos: ${{ steps.source.outputs.models_macos }}
      arch_needed: ${{ steps.source.outputs.arch_needed }}
      arch_stages: ${{ steps.source.outputs.arch_stages }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Reconcile outside the evictable publisher queue
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        QUALIFY_CONSUMERS: ${{ inputs.qualify_consumers && 'true' || 'false' }}
        CORE_LOCK_HASH: ${{ hashFiles('packages/foresight_core/pubspec.lock') }}
        UI_LOCK_HASH: ${{ hashFiles('packages/foresight_core/pubspec.lock', 'apps/desktop/pubspec.lock') }}
        MODEL_INPUT_HASH: ${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      run: python3 tools/ci_cache_reconcile.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cache-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/cache-reconciliation.json
        overwrite: true
        if-no-files-found: error
  dispatch-refresh:
    needs: reconcile
    if: github.ref == 'refs/heads/main' && needs.reconcile.outputs.current == 'true' && contains(fromJSON('["push","schedule"]'), github.event_name) && (needs.reconcile.outputs.registry_needed == 'true' || needs.reconcile.outputs.common == 'true' || needs.reconcile.outputs.arch_needed == 'true' || needs.reconcile.outputs.models_macos == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - name: Dispatch the dedicated current-main cache publisher
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        case "$GITHUB_EVENT_NAME" in push|schedule) ;; *) exit 1 ;; esac
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/linux-cache-publish.yml/dispatches" \
          --method POST --field ref=main
  publish-linux-caches:
    needs: reconcile
    if: github.ref == 'refs/heads/main' && needs.reconcile.outputs.current == 'true' && needs.reconcile.outputs.registry_needed == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: linux-application-cache-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require current reviewed main before cache work
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/linux-cache-publish.yml@refs/heads/main"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
    - name: Recheck sibling readiness after acquiring the publisher queue
      id: readiness
      env:
        GH_TOKEN: ${{ github.token }}
        QUALIFY_CONSUMERS: ${{ inputs.qualify_consumers && 'true' || 'false' }}
      run: python3 tools/ci_cache_reconcile.py --publisher-recheck --output test-results/cache-maintenance/recheck.json
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      if: steps.readiness.outputs.publish == 'true'
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      if: steps.readiness.outputs.publish == 'true'
      with:
        driver: docker
    - name: Authenticate the dedicated main cache publisher
      if: steps.readiness.outputs.publish == 'true'
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Restore qualified SDK outputs without a local SDK build fallback
      id: sdk
      if: steps.readiness.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        CI_TIER: sweep
      run: python3 tools/ci_linux_shadow_sdk.py --source "$GITHUB_SHA" --own-pr 0 --directory build/cache-sdk
    - name: Recheck current main immediately before registry writes
      if: steps.readiness.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
    - name: Publish or reuse immutable qualified CI tooling
      id: tooling
      if: steps.readiness.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
      run: |
        task_snapshot=$(python3 -c 'import json; print(json.load(open("tools/pins.json"))["ubuntu_snapshot"])')
        python3 tools/ci_tooling_image.py --repository "$GITHUB_REPOSITORY" \
          --sdk-image "$SDK_IMAGE" --snapshot "$task_snapshot" --output build/cache-tooling --publish
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.readiness.outputs.publish == 'true' && steps.tooling.outputs.tooling_reused != 'true'
      with:
        name: ci-tooling-${{ steps.tooling.outputs.tooling_identity }}
        path: build/cache-tooling/tooling.json
        overwrite: true
        if-no-files-found: error
        retention-days: 30
    - name: Publish only isolated secret-free dependency and acceptance caches
      id: publication
      if: steps.readiness.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        TOOLING_IMAGE: ${{ steps.tooling.outputs.tooling_image }}
        CI_CACHE_NAMESPACE: isolated-v2
      run: bash tools/publish_linux_ci_caches.sh
    - name: Retain maintenance state independently of application validation
      if: always()
      env:
        MAINTENANCE_RESULT: ${{ job.status }}
        PUBLICATION_EXECUTED: ${{ steps.publication.outcome == 'success' && 'true' || 'false' }}
      run: |
        mkdir -p test-results/cache-maintenance
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        Path('test-results/cache-maintenance/result.json').write_text(json.dumps({
            'source': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
            'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'result': os.environ['MAINTENANCE_RESULT'],
            'scope': 'isolated-v2',
            'publication_executed': os.environ['PUBLICATION_EXECUTED'] == 'true',
        }) + '\n')
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cache-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/cache-maintenance/
        if-no-files-found: error
  publish-common-caches:
    needs: reconcile
    if: github.ref == 'refs/heads/main' && needs.reconcile.outputs.current == 'true' && needs.reconcile.outputs.common == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: linux-common-cache-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.formatter == 'true' || needs.reconcile.outputs.document == 'true'
      id: quality-flutter
      with:
        path: ${{ runner.temp }}/flutter
        key: quality-flutter-linux-3.35.7
    - name: Prepare the pinned formatter SDK without rebuilding dependencies
      if: needs.reconcile.outputs.formatter == 'true' || needs.reconcile.outputs.document == 'true'
      run: |
        if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        fi
        test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        "$RUNNER_TEMP/flutter/bin/dart" --version
    - name: Guard formatter cache save
      if: needs.reconcile.outputs.formatter == 'true'
      id: formatter-current
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/ci_cache_publish_guard.py
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.formatter == 'true' && steps.formatter-current.outputs.current == 'true' && steps.quality-flutter.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/flutter
        key: quality-flutter-linux-3.35.7
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.document == 'true'
      id: document-flutter
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v2
        restore-keys: flutter-linux-document-host-3.35.7-v1
    - name: Verify the document toolchain before publishing
      if: needs.reconcile.outputs.document == 'true'
      run: |
        task_document_flutter="$RUNNER_TEMP/foresight-document-flutter"
        if [[ ! -x "$task_document_flutter/bin/dart" ]]; then
          mkdir -p "$task_document_flutter"
          cp -a "$RUNNER_TEMP/flutter/." "$task_document_flutter/"
        fi
        test "$(git -C "$task_document_flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        "$task_document_flutter/bin/dart" --version
    - name: Guard document cache save
      if: needs.reconcile.outputs.document == 'true'
      id: document-current
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/ci_cache_publish_guard.py
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.document == 'true' && steps.document-current.outputs.current == 'true' && steps.document-flutter.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v2
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.models_linux == 'true'
      id: models
      with:
        path: build/acceptance-models
        key: main-integration-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
        restore-keys: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
    - name: Verify pinned model bytes before publishing
      if: needs.reconcile.outputs.models_linux == 'true'
      run: python3 tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output test-results/model-download
    - name: Guard model cache save
      if: needs.reconcile.outputs.models_linux == 'true'
      id: models-current
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/ci_cache_publish_guard.py
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: needs.reconcile.outputs.models_linux == 'true' && steps.models-current.outputs.current == 'true' && steps.models.outputs.cache-hit != 'true'
      with:
        path: build/acceptance-models
        key: main-integration-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
  publish-arch-caches:
    needs: reconcile
    if: github.ref == 'refs/heads/main' && needs.reconcile.outputs.current == 'true' && needs.reconcile.outputs.arch_needed == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.reconcile.outputs.arch_stages) }}
    concurrency:
      group: linux-arch-language-cache-publish-${{ matrix.stage }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Bootstrap Git in the pinned Arch container
      run: pacman -Syu --noconfirm git
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: ./.github/actions/setup-linux-stage
      with:
        stage: ${{ matrix.stage }}
        publish-language-caches: 'true'
  publish-macos-models:
    needs: reconcile
    if: github.ref == 'refs/heads/main' && needs.reconcile.outputs.current == 'true' && needs.reconcile.outputs.models_macos == 'true' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/macos-cache-publish.yml
    with:
      publish_toolchain: false
      publish_models: true
  qualification-consumers:
    needs: [reconcile, publish-linux-caches]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.qualify_consumers && needs.reconcile.outputs.current == 'true' && needs.publish-linux-caches.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Verify the current reviewed qualification source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
    - name: Install pinned host contract tools
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Allow isolated document namespaces in qualification containers
      run: bash tools/ci_package_sandbox.sh
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate read-only qualified cache access
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Restore verified SDK bytes without compilation fallback
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        CI_TIER: sweep
      run: python3 tools/ci_linux_shadow_sdk.py --source "$GITHUB_SHA" --own-pr 0 --directory build/qualification-sdk
    - name: Build and freshly test actual publisher consumers
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        SOURCE_REVISION: ${{ github.sha }}
        CI_TIER: sweep
        FORESIGHT_CONTAINER_APPARMOR: foresight-ci-document-sandbox
      run: bash tools/build_linux_container.sh --output build/qualify-consumers
    - name: Run the real cache transport fixture on the Docker host
      env:
        FORESIGHT_DOCKER_CACHE_TEST: '1'
        CACHE_FIXTURE_BASE: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      run: |
        docker image inspect "$CACHE_FIXTURE_BASE" >/dev/null 2>&1 || docker pull "$CACHE_FIXTURE_BASE"
        python -m pytest tests/test_acceptance_image_cache.py -ra
    - name: Record actual current-source application and coverage evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m tools.ci_transport_exercise --kind publisher --source "$GITHUB_SHA" \
          --record-application build/qualify-consumers --output build/qualification/publisher.json
        python -m tools.ci_rollout --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
          --attempt "$GITHUB_RUN_ATTEMPT" --producer-job qualification-consumers \
          --exercise-record build/qualification/publisher.json --output build/qualification/qualification.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-rollout-qualification
        path: build/qualification/qualification.json
        overwrite: true
        if-no-files-found: error
    - name: Retain consumer execution evidence and failed command output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualification-consumers-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/qualify-consumers/evidence/
          build/qualify-consumers/ci-inputs.json
          build/qualification/publisher.json
        overwrite: true
        if-no-files-found: warn
