name: Preview packages
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Recover packaging from an existing preview run, retaining its source and build identity
        type: string
        default: '0'
      rebuild_reason:
        description: Exact output-affecting reason for a forced new preview identity
        type: string
        default: ''
      validation:
        description: Installer smoke checks, or full model and cloud acceptance
        type: choice
        options: [standard, full]
        default: standard
      force:
        description: Rebuild even when this main commit already has a successful preview
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # Preview and official distributions must reserve/publish in sequence.
  group: distribution-packages
  cancel-in-progress: false
jobs:
  plan:
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      source: ${{ steps.plan.outputs.source }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
      recovery_run: ${{ steps.plan.outputs.recovery_run }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      label: ${{ steps.plan.outputs.label }}
      package_version: ${{ steps.plan.outputs.package_version }}
      validation: ${{ steps.plan.outputs.validation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Skip unchanged successful previews and reserve build identity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          VALIDATION: ${{ inputs.validation || 'standard' }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
          CANDIDATE_RUN: ${{ inputs.candidate_run || '0' }}
        run: |
          task_args=()
          if [[ "$FORCE" == true ]]; then task_args+=(--force); fi
          python tools/preview_packages.py plan --repository "$GITHUB_REPOSITORY" --validation "$VALIDATION" --rebuild-reason "$REBUILD_REASON" --candidate-run "$CANDIDATE_RUN" "${task_args[@]}"
  build:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      preview: true
      source: ${{ needs.plan.outputs.source }}
      version: ${{ needs.plan.outputs.version }}
      build_number: ${{ needs.plan.outputs.build_number }}
      label: ${{ needs.plan.outputs.label }}
  linux:
    needs: [plan, build]
    if: "!cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.plan.outputs.recovery_run != '0')"
    env:
      PACKAGE_CONTAINER: preview-package-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          - format: rpm
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - format: arch
            image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Allow isolated document namespaces in package-test containers
        run: bash tools/ci_package_sandbox.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.recovery_run == '0'
        with:
          name: preview-linux-portable
          path: artifacts
      - name: Restore original linux application candidate for packaging recovery
        if: needs.plan.outputs.recovery_run != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.recovery_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --application linux --directory artifacts
      - name: Retain an already validated original installer
        if: needs.plan.outputs.recovery_run != '0'
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.recovery_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
          FORMAT: ${{ matrix.format }}
        run: |
          if python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --format "$FORMAT" --directory dist/packages --optional; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            task_status=$?
            test "$task_status" = 4
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package and test native installation lifecycle and version ordering
        if: steps.retained.outputs.hit != 'true'
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.plan.outputs.package_version }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct FETCH_HEAD)
          export SOURCE_DATE_EPOCH
          docker run --rm -d --name "$PACKAGE_CONTAINER" --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH "$IMAGE" sleep infinity
          docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" 1 build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-installer-linux-${{ matrix.format }}
          path: dist/packages/
          if-no-files-found: ignore
          retention-days: 90
      - name: Validate retained package bytes through installation lifecycle
        if: steps.retained.outputs.hit != 'true'
        env:
          FORMAT: ${{ matrix.format }}
          VERSION: ${{ needs.plan.outputs.package_version }}
        run: docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" 1 test
      - name: Test the same DEB on Debian 13
        if: matrix.format == 'deb' && steps.retained.outputs.hit != 'true'
        run: docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work:ro" -v "$PWD/dist/packages:/packages:ro" debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 bash /work/packaging/ci/test-debian.sh
      - name: Restore ownership and record installer identity
        env:
          FORMAT: ${{ matrix.format }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          mkdir -p build
          sudo chown -R "$(id -u):$(id -g)" dist/packages build
          python tools/preview_packages.py receipt --directory dist/packages --format "$FORMAT" --source "$SOURCE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Full installed model acceptance
        if: needs.plan.outputs.validation == 'full'
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p reports
          python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
          docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -e OPEN_FORESIGHT_ACCEPTANCE_DISPOSABLE=1 -v "$PWD:/work:ro" -v "$PWD/dist/packages:/assets:ro" -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/reports:/reports" "$IMAGE" bash /work/packaging/ci/test-release-package.sh "$FORMAT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Full bundled cloud acceptance on Linux
        if: needs.plan.outputs.validation == 'full' && matrix.format == 'deb'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dpkg-deb -x dist/packages/*.deb build/cloud-package
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/cloud-sdk
          python tools/linux_sdk_artifacts.py resolve --prefix build/cloud-sdk --discard-archive
          task_sdk=$(python -c 'import json; print(json.load(open("build/cloud-sdk/image.json"))["image"])')
          docker run --rm -v "$PWD:/work" -w /work "$task_sdk" python3 tools/verify_preview_cloud.py --bundle build/cloud-package/opt/open-foresight --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-evidence-linux-${{ matrix.format }}
          overwrite: true
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove disposable package-test container
        if: always()
        run: docker rm -f "$PACKAGE_CONTAINER" 2>/dev/null || true
  macos:
    needs: [plan, build]
    if: "!cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.plan.outputs.recovery_run != '0')"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.recovery_run == '0'
        with:
          name: preview-macos-application
          path: artifacts
      - name: Restore original macos application candidate for packaging recovery
        if: needs.plan.outputs.recovery_run != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.recovery_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --application macos --directory artifacts
      - name: Retain an already validated original installer
        if: needs.plan.outputs.recovery_run != '0'
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.recovery_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
          FORMAT: dmg
        run: |
          if python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --format "$FORMAT" --directory dist --optional; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            task_status=$?
            test "$task_status" = 4
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the original application for cloud validation
        run: |
          mkdir -p staging dist
          ditto -x -k artifacts/Open-Foresight-macos-arm64.zip staging
      - name: Create DMG using the official release packager
        if: steps.retained.outputs.hit != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          LABEL: ${{ needs.plan.outputs.label }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          python tools/create_dmg.py --app 'staging/Open Foresight.app' --manifest 'artifacts/Open Foresight.manifest.json' --name "Open-Foresight-$VERSION-$LABEL-macos-arm64.dmg" --output dist
          python tools/preview_packages.py receipt --directory dist --format dmg --source "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-installer-macos
          path: dist/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare model fixtures for full acceptance
        if: needs.plan.outputs.validation == 'full'
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Install DMG, smoke test or exercise models, reinstall and remove
        if: steps.retained.outputs.hit != 'true' || needs.plan.outputs.validation == 'full'
        env:
          VALIDATION: ${{ needs.plan.outputs.validation }}
        run: |
          task_dmg=(dist/*.dmg)
          python tools/test_release_dmg.py --dmg "${task_dmg[0]}" --destination "$RUNNER_TEMP/preview-install/Open Foresight.app" --validation "$VALIDATION" --models build/acceptance-models --output reports
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-macos-arm64-3.35.7-v1
      - name: Full bundled cloud acceptance on Mac
        if: needs.plan.outputs.validation == 'full'
        run: |
          if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
            git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          python tools/verify_preview_cloud.py --bundle 'staging/Open Foresight.app' --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-evidence-macos
          overwrite: true
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  reuse-linux:
    needs: plan
    if: needs.plan.outputs.reuse_run != '0' && needs.plan.outputs.reuse_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {format: deb, image: 'ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac'}
          - {format: rpm, image: 'fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80'}
          - {format: arch, image: 'archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and restore the original preview installer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.reuse_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
          FORMAT: ${{ matrix.format }}
        run: python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --format "$FORMAT" --directory assets
      - name: Allow isolated document namespaces in package-test containers
        run: bash tools/ci_package_sandbox.sh
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare authenticated public model fixtures
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Exercise retained installer bytes without rebuilding
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -e OPEN_FORESIGHT_ACCEPTANCE_DISPOSABLE=1 -v "$PWD:/work:ro" -v "$PWD/assets:/assets:ro" -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/reports:/reports" "$IMAGE" bash /work/packaging/ci/test-release-package.sh "$FORMAT"
          if [[ "$FORMAT" == deb ]]; then
            docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -e OPEN_FORESIGHT_ACCEPTANCE_DISPOSABLE=1 -v "$PWD:/work:ro" -v "$PWD/assets:/assets:ro" -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/reports:/reports" debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 bash /work/packaging/ci/test-release-package.sh deb
          fi
      - name: Verify bundled cloud settings from the retained DEB
        if: matrix.format == 'deb'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dpkg-deb -x assets/*.deb build/retained-package
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/cloud-sdk
          python tools/linux_sdk_artifacts.py resolve --prefix build/cloud-sdk --discard-archive
          task_sdk=$(python -c 'import json; print(json.load(open("build/cloud-sdk/image.json"))["image"])')
          docker run --rm -v "$PWD:/work" -w /work "$task_sdk" python3 tools/verify_preview_cloud.py --bundle build/retained-package/opt/open-foresight --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-revalidation-${{ matrix.format }}
          path: |
            assets/original-producer.json
            reports/
          retention-days: 90
  reuse-macos:
    needs: plan
    if: needs.plan.outputs.reuse_run != '0' && needs.plan.outputs.reuse_run != ''
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and restore the original DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.reuse_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --format dmg --directory assets
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare authenticated public model fixtures
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Exercise the original DMG installer
        run: |
          task_dmg=(assets/*.dmg)
          python tools/test_release_dmg.py --dmg "${task_dmg[0]}" --destination "$RUNNER_TEMP/preview-install/Open Foresight.app" --validation full --models build/acceptance-models --output reports
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-macos-arm64-3.35.7-v1
      - name: Verify bundled cloud settings from the retained DMG
        run: |
          if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
            git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/preview-mount" staging
          task_dmg=(assets/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/preview-mount" "${task_dmg[0]}"
          trap 'hdiutil detach "$RUNNER_TEMP/preview-mount"' EXIT
          ditto "$RUNNER_TEMP/preview-mount/Open Foresight.app" 'staging/Open Foresight.app'
          python tools/verify_preview_cloud.py --bundle 'staging/Open Foresight.app' --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-revalidation-dmg
          path: |
            assets/original-producer.json
            reports/
          retention-days: 90
  revalidation:
    needs: [plan, reuse-linux, reuse-macos]
    if: needs.plan.outputs.reuse_run != '0' && needs.plan.outputs.reuse_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: preview-revalidation-*
          path: evidence
      - name: Bind new validation to the original installers
        env:
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          records = [json.loads(path.read_text()) for path in Path('evidence').rglob('original-producer.json')]
          if len(records) != 4 or {item['format'] for item in records} != {'deb','rpm','arch','dmg'} or {item['source_commit'] for item in records} != {os.environ['SOURCE']} or len({item['build_number'] for item in records}) != 1:
              raise ValueError('Revalidation must bind every format to the original source/build identity')
          Path('evidence/validation.json').write_text(json.dumps({'validation':'full','status':'passed','installers':records,'validation_run':os.environ['GITHUB_RUN_ID']},indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-full-validation
          path: evidence/
          retention-days: 90
  publish:
    if: "!cancelled() && needs.plan.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && (needs.build.result == 'success' || needs.plan.outputs.recovery_run != '0')"
    timeout-minutes: 10
    needs: [plan, build, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: preview-installer-*
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.recovery_run == '0'
        with:
          name: preview-linux-portable
          path: packages/portable
      - name: Restore the original portable candidate for packaging recovery
        if: needs.plan.outputs.recovery_run != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.recovery_run }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: python -m tools.preview_reuse --run "$RUN" --source "$SOURCE" --application linux --directory packages/portable
      - name: Write provenance and acceptance summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          LABEL: ${{ needs.plan.outputs.label }}
          SOURCE: ${{ needs.plan.outputs.source }}
          VALIDATION: ${{ needs.plan.outputs.validation }}
        run: python tools/preview_packages.py manifest --directory packages --version "$VERSION" --build-number "$BUILD_NUMBER" --label "$LABEL" --source "$SOURCE" --validation "$VALIDATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: download
        with:
          name: Open-Foresight-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.label }}-${{ needs.plan.outputs.source }}
          path: packages/
          if-no-files-found: error
          retention-days: 90
      - name: Link the tested packages
        env:
          DOWNLOAD: ${{ steps.download.outputs.artifact-url }}
        run: echo "Download tested preview installers at $DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
