name: Preview packages
run-name: "${{ inputs.exercise_failure_path && 'Nightly exercise' || 'Nightly preview' }} ${{ github.sha }}"
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      exercise_failure_path:
        description: Exercise the isolated nightly issue without building or publishing
        type: boolean
        default: false
      exercise_recovery:
        description: Close the isolated exercise issue with a synthetic success
        type: boolean
        default: false
      rebuild_reason:
        description: Exact output-affecting reason for a forced new preview identity
        type: string
        default: ''
      validation:
        description: Installer smoke checks, or full model and cloud acceptance
        type: choice
        options: [standard, full]
        default: standard
      force:
        description: Rebuild even when this main commit already has a successful preview
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.exercise_failure_path && 'preview-packages-exercise' || 'preview-packages' }}
  cancel-in-progress: false
jobs:
  publish-macos-caches:
    needs: plan
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !inputs.exercise_failure_path && needs.plan.result == 'success' && needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/macos-cache-publish.yml
  plan:
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      label: ${{ steps.plan.outputs.label }}
      package_version: ${{ steps.plan.outputs.package_version }}
      validation: ${{ steps.plan.outputs.validation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Skip unchanged successful previews and reserve build identity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          VALIDATION: ${{ inputs.validation || 'standard' }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
          EXERCISE: ${{ inputs.exercise_failure_path }}
        run: |
          if [[ "$EXERCISE" == true ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          task_args=()
          if [[ "$FORCE" == true ]]; then task_args+=(--force); fi
          python tools/preview_packages.py plan --repository "$GITHUB_REPOSITORY" --validation "$VALIDATION" --rebuild-reason "$REBUILD_REASON" "${task_args[@]}"
  build:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      preview: true
      macos_coverage: true
      acceptance: ${{ needs.plan.outputs.validation }}
      source: ${{ needs.plan.outputs.source }}
      version: ${{ needs.plan.outputs.version }}
      build_number: ${{ needs.plan.outputs.build_number }}
      label: ${{ needs.plan.outputs.label }}
  linux:
    name: linux (${{ matrix.format }})
    needs: [plan, build]
    if: "!cancelled() && needs.plan.result == 'success' && needs.build.result == 'success'"
    env:
      PACKAGE_CONTAINER: preview-package-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          - format: rpm
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - format: arch
            image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Allow isolated document namespaces in package-test containers
        run: bash tools/ci_package_sandbox.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: preview-linux-portable
          path: artifacts
      - name: Package and test native installation lifecycle and version ordering
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.plan.outputs.package_version }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct FETCH_HEAD)
          export SOURCE_DATE_EPOCH
          docker run --rm -d --name "$PACKAGE_CONTAINER" --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH "$IMAGE" sleep infinity
          docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" 1 build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-installer-linux-${{ matrix.format }}
          overwrite: true
          path: dist/packages/
          if-no-files-found: ignore
          retention-days: 90
      - name: Validate retained package bytes through installation lifecycle
        env:
          FORMAT: ${{ matrix.format }}
          VERSION: ${{ needs.plan.outputs.package_version }}
        run: docker exec "$PACKAGE_CONTAINER" bash packaging/ci/package-and-test.sh "$FORMAT" "$VERSION" 1 test
      - name: Test the same DEB on Debian 13
        if: matrix.format == 'deb'
        run: docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work:ro" -v "$PWD/dist/packages:/packages:ro" debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 bash /work/packaging/ci/test-debian.sh
      - name: Restore ownership and record installer identity
        env:
          FORMAT: ${{ matrix.format }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          mkdir -p build
          sudo chown -R "$(id -u):$(id -g)" dist/packages build
          python tools/preview_packages.py receipt --directory dist/packages --format "$FORMAT" --source "$SOURCE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Full installed model acceptance
        if: needs.plan.outputs.validation == 'full'
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p reports
          python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
          docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -e OPEN_FORESIGHT_ACCEPTANCE_DISPOSABLE=1 -v "$PWD:/work:ro" -v "$PWD/dist/packages:/assets:ro" -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/reports:/reports" "$IMAGE" bash /work/packaging/ci/test-release-package.sh "$FORMAT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Full bundled cloud acceptance on Linux
        if: needs.plan.outputs.validation == 'full' && matrix.format == 'deb'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dpkg-deb -x dist/packages/*.deb build/cloud-package
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/cloud-sdk
          python tools/linux_sdk_artifacts.py resolve --prefix build/cloud-sdk --discard-archive
          task_sdk=$(python -c 'import json; print(json.load(open("build/cloud-sdk/image.json"))["image"])')
          docker run --rm -v "$PWD:/work" -w /work "$task_sdk" python3 tools/verify_preview_cloud.py --bundle build/cloud-package/opt/open-foresight --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-evidence-linux-${{ matrix.format }}
          overwrite: true
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove disposable package-test container
        if: always()
        run: docker rm -f "$PACKAGE_CONTAINER" 2>/dev/null || true
  macos:
    needs: [plan, build]
    if: "!cancelled() && needs.plan.result == 'success' && needs.build.result == 'success'"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: preview-macos-application
          path: artifacts
      - name: Restore the original application for cloud validation
        run: |
          mkdir -p staging dist
          ditto -x -k artifacts/Open-Foresight-macos-arm64.zip staging
      - name: Create DMG using the official release packager
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          LABEL: ${{ needs.plan.outputs.label }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          python tools/create_dmg.py --app 'staging/Open Foresight.app' --manifest 'artifacts/Open Foresight.manifest.json' --name "Open-Foresight-$VERSION-$LABEL-macos-arm64.dmg" --output dist
          python tools/preview_packages.py receipt --directory dist --format dmg --source "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-installer-macos
          overwrite: true
          path: dist/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare model fixtures for full acceptance
        if: needs.plan.outputs.validation == 'full'
        run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output reports
      - name: Install DMG, smoke test or exercise models, reinstall and remove
        env:
          VALIDATION: ${{ needs.plan.outputs.validation }}
        run: |
          task_dmg=(dist/*.dmg)
          python tools/test_release_dmg.py --dmg "${task_dmg[0]}" --destination "$RUNNER_TEMP/preview-install/Open Foresight.app" --validation "$VALIDATION" --models build/acceptance-models --output reports
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: build/acceptance-models
          key: preview-models-${{ runner.os }}-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.plan.outputs.validation == 'full'
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-macos-arm64-3.35.7-v1
      - name: Full bundled cloud acceptance on Mac
        if: needs.plan.outputs.validation == 'full'
        run: |
          if [[ ! -x "$RUNNER_TEMP/flutter/bin/dart" ]]; then
            git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          python tools/verify_preview_cloud.py --bundle 'staging/Open Foresight.app' --output reports/cloud.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-evidence-macos
          overwrite: true
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  publish:
    if: "!cancelled() && needs.plan.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.build.result == 'success'"
    timeout-minutes: 10
    needs: [plan, build, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: preview-installer-*
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: preview-linux-portable
          path: packages/portable
      - name: Write provenance and acceptance summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          LABEL: ${{ needs.plan.outputs.label }}
          SOURCE: ${{ needs.plan.outputs.source }}
          VALIDATION: ${{ needs.plan.outputs.validation }}
        run: python tools/preview_packages.py manifest --directory packages --version "$VERSION" --build-number "$BUILD_NUMBER" --label "$LABEL" --source "$SOURCE" --validation "$VALIDATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: download
        with:
          name: Open-Foresight-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.label }}-${{ needs.plan.outputs.source }}
          overwrite: true
          path: packages/
          if-no-files-found: error
          retention-days: 90
      - name: Link the tested packages
        env:
          DOWNLOAD: ${{ steps.download.outputs.artifact-url }}
        run: echo "Download tested preview installers at $DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
  exercise:
    needs: plan
    if: inputs.exercise_failure_path
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Synthetic nightly result without build or publication
        env:
          RECOVERY: ${{ inputs.exercise_recovery }}
        run: test "$RECOVERY" = true
  weekly-audit-plan:
    needs: [plan, nightly-checks]
    if: "!cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && !inputs.exercise_failure_path"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.audit.outputs.selected }}
      source: ${{ steps.audit.outputs.source }}
      producer_run: ${{ steps.audit.outputs.producer_run }}
      attempt: ${{ steps.audit.outputs.attempt }}
      artifact_id: ${{ steps.audit.outputs.artifact_id }}
      artifact_digest: ${{ steps.audit.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select only a green same-source preview for weekly or explicit full audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          VALIDATION: ${{ inputs.validation || 'standard' }}
        run: |
          task_args=()
          if [[ "$VALIDATION" == full ]]; then task_args+=(--full); fi
          python3 tools/ci_preview_audit.py plan --source "$SOURCE" ${task_args[@]+"${task_args[@]}"}
  weekly-external-audit:
    needs: weekly-audit-plan
    if: "!cancelled() && needs.weekly-audit-plan.outputs.selected == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Require successful exact-source preview qualification
        env:
          PLAN_RESULT: ${{ needs.weekly-audit-plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.weekly-audit-plan.outputs.source }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Restore only original green preview bytes and their recorded stamp
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.weekly-audit-plan.outputs.source }}
          PRODUCER_RUN: ${{ needs.weekly-audit-plan.outputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ needs.weekly-audit-plan.outputs.attempt }}
          ARTIFACT_ID: ${{ needs.weekly-audit-plan.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.weekly-audit-plan.outputs.artifact_digest }}
        run: python tools/ci_preview_audit.py restore --source "$SOURCE" --producer-run "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker
      - name: Authenticate read-only audit tool caches
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Restore the preview build's exact verified SDK without compilation
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.weekly-audit-plan.outputs.source }}
        run: |
          python tools/ci_linux_sdk_reference.py restore --source "$SOURCE" --directory build/audit-sdk
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/acceptance-models
          key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Audit external CPU models using the original preview
        id: cpu-audit
        if: "!cancelled() && steps.bundle.outcome == 'success' && steps.sdk.outcome == 'success'"
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_IMAGE: ${{ steps.sdk.outputs.image }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: bash tools/linux_acceptance.sh cpu
      - name: Audit virtual audio, meeting UI and software Vulkan independently
        id: audio-audit
        if: "!cancelled() && steps.bundle.outcome == 'success' && steps.sdk.outcome == 'success'"
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_IMAGE: ${{ steps.sdk.outputs.image }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: bash tools/linux_acceptance.sh audio
      - name: Audit Ubuntu and Debian 13 lifecycle against those same bytes
        id: deb-audit
        if: "!cancelled() && steps.bundle.outcome == 'success' && steps.sdk.outcome == 'success'"
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          ACCEPTANCE_FULL: 'true'
        run: bash tools/linux_acceptance.sh deb
      - name: Record completed weekly external audit
        id: completed-audit
        if: "!cancelled() && steps.cpu-audit.outcome == 'success' && steps.audio-audit.outcome == 'success' && steps.deb-audit.outcome == 'success'"
        env:
          SOURCE: ${{ needs.weekly-audit-plan.outputs.source }}
          AUDIT_CPU: ${{ steps.cpu-audit.outcome }}
          AUDIT_AUDIO: ${{ steps.audio-audit.outcome }}
          AUDIT_DEB: ${{ steps.deb-audit.outcome }}
        run: python tools/ci_preview_audit.py record --source "$SOURCE"
      - name: Upload completed weekly external audit receipt
        if: steps.completed-audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-external-audit-completion-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: test-results/weekly-audit/completion.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain weekly external drift evidence separately from publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-external-audit-evidence
          overwrite: true
          path: |
            test-results/
            artifacts/source-qualification.json
            artifacts/distribution-stamp.json
          if-no-files-found: warn
          retention-days: 30
  weekly-audit-issue:
    needs: weekly-external-audit
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.weekly-external-audit.result != 'skipped'
    concurrency:
      group: ci-preview-external-drift-issue
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Track the newest actual weekly audit independently of nightly success
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_drift_issue.py preview-packages.yml
  nightly-checks:
    needs: [plan, build, linux, macos, publish, exercise]
    if: always() && (needs.plan.outputs.build == 'true' || needs.plan.result != 'success' || inputs.exercise_failure_path)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require every selected suite in this run
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXERCISE: ${{ inputs.exercise_failure_path }}
        run: python3 tools/ci_nightly.py aggregate
  nightly-issue:
    needs: [plan, nightly-checks]
    if: always() && github.ref == 'refs/heads/main' && (needs.plan.outputs.build == 'true' || needs.plan.result != 'success' || inputs.exercise_failure_path)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Track nightly failures and close recovered issues
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.nightly-checks.result }}
          EXERCISE: ${{ inputs.exercise_failure_path }}
        run: python3 tools/ci_nightly.py issue
