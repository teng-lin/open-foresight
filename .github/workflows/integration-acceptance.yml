name: Model and virtual audio acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      linux_bundle: ${{ steps.select.outputs.linux_bundle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select integration acceptance
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then args+=(--force); fi
          python3 tools/ci_changes.py --base "$BASE" "${args[@]}"
  acceptance-checks:
    timeout-minutes: 5
    if: always()
    needs: [changes, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected integration acceptance
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.linux_bundle }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$SELECTED" == true ]]; then
            test "$LINUX_RESULT" = success
          else
            test "$SELECTED" = false
            test "$LINUX_RESULT" = skipped
          fi
  linux:
    needs: changes
    if: needs.changes.outputs.linux_bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free hosted-runner space for SDK and model fixtures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch verified Linux SDK descriptor
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OWN_PR: ${{ github.event.pull_request.number || 0 }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |-
          # Forks retain local validation without consuming untrusted archives.
          if [[ "$FORK_PR" == true ]]; then
            tools/build_linux_sdk_local.sh
            echo 'image=foresight-sdk:pr' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/sdk-descriptor --wait 12600 --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
          python tools/linux_sdk_artifacts.py resolve --prefix build/sdk-descriptor --discard-archive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          # Local SDK tags need Docker; registry caches use the container driver.
          driver: ${{ steps.sdk.outputs.cache && 'docker-container' || 'docker' }}
      - name: Authenticate SDK registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build disposable acceptance image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: packaging/build.Dockerfile
          target: integration
          load: true
          tags: foresight-integration:local
          build-args: |
            SDK_IMAGE=${{ steps.sdk.outputs.image }}
            SOURCE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: ${{ steps.sdk.outputs.cache && format('type=registry,ref={0}', steps.sdk.outputs.cache) || '' }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: models
        with:
          path: build/acceptance-models
          key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare checksum-pinned public model fixtures
        id: fixtures
        run: |
          python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output test-results/model-download
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.models.outputs.cache-hit != 'true'
        with:
          path: build/acceptance-models
          key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Real CPU model, helper, citation and cancellation gates
        run: |
          mkdir -p test-results/models test-results/virtual-audio
          chmod 0777 test-results/models test-results/virtual-audio
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/test-results/models:/reports" \
            foresight-integration:local python3 tools/integration_gates.py --suite models \
            --bundle dist/open-foresight --models /models --output /reports
      - name: Private virtual-audio and device-recovery gates
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          mkdir -p test-results/virtual-audio
          chmod 0777 test-results/virtual-audio
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/test-results/virtual-audio:/reports" \
            foresight-integration:local dbus-run-session -- python3 tools/integration_gates.py --suite virtual-audio \
            --bundle dist/open-foresight --models /models --output /reports
      - name: Retain explicit integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-acceptance-evidence
          path: test-results/
