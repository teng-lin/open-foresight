name: Model and virtual audio acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      linux_bundle: ${{ steps.select.outputs.linux_bundle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select integration acceptance
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" == push ]]; then
            # Deleted/recreated branches and unavailable history must fail safe.
            if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ || "$BASE" == 0000000000000000000000000000000000000000 ]] ||
               ! git cat-file -e "$BASE^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$BASE" HEAD; then
              BASE=HEAD
              args+=(--force)
            fi
          elif [[ "$EVENT" != pull_request ]]; then
            args+=(--force)
          fi
          python3 tools/ci_changes.py --base "$BASE" "${args[@]}"
  acceptance-checks:
    timeout-minutes: 5
    if: always()
    needs: [changes, ubuntu-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected integration acceptance
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.linux_bundle }}
          LINUX_RESULT: ${{ needs.ubuntu-package.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$SELECTED" == true ]]; then
            test "$LINUX_RESULT" = success
          else
            test "$SELECTED" = false
            test "$LINUX_RESULT" = skipped
          fi
  ubuntu-package:
    needs: changes
    if: needs.changes.outputs.linux_bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free hosted-runner space for SDK and model fixtures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Allow isolated document namespaces in package-test containers
        run: bash tools/ci_package_sandbox.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch verified Linux SDK descriptor
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OWN_PR: ${{ github.event.pull_request.number || 0 }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |-
          # Forks retain local validation without consuming untrusted archives.
          if [[ "$FORK_PR" == true ]]; then
            tools/build_linux_sdk_local.sh
            echo 'image=foresight-sdk:pr' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/sdk-descriptor --wait 12600 --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
          python tools/linux_sdk_artifacts.py resolve --prefix build/sdk-descriptor --discard-archive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          # Local SDK tags need Docker; registry caches use the container driver.
          driver: ${{ steps.sdk.outputs.cache && 'docker-container' || 'docker' }}
      - name: Authenticate SDK registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the shared Ubuntu 24.04 application and acceptance image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: packaging/build.Dockerfile
          target: integration
          load: true
          tags: foresight-integration:local
          build-args: |
            SDK_IMAGE=${{ steps.sdk.outputs.image }}
            SOURCE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: ${{ steps.sdk.outputs.cache && format('type=registry,ref={0}', steps.sdk.outputs.cache) || '' }}
      - name: Package version
        id: version
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'tools')
          from app_version import read_version, stale
          if paths := stale():
              raise SystemExit('Out of date with apps/desktop/pubspec.yaml: ' + ', '.join(paths))
          version, _ = read_version()
          release = '1'
          epoch = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nrelease={release}\nepoch={epoch}\n')
          PY
      - name: Export the exact Ubuntu acceptance application for packaging
        run: |
          mkdir -p build/portable/dist
          task_container=$(docker create foresight-integration:local /bin/true)
          trap 'docker rm "$task_container" >/dev/null' EXIT
          docker cp "$task_container:/src/dist/open-foresight" build/portable/dist/
      - name: Build and install the Ubuntu 24.04 package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          python3 packaging/package_linux.py --bundle build/portable/dist/open-foresight --format tar --version "$VERSION" --release "$RELEASE"
          mkdir -p artifacts
          cp dist/packages/*.tar.gz dist/packages/*.tar.gz.sha256 artifacts/
          docker run --rm --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=foresight-ci-document-sandbox -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac bash packaging/ci/package-and-test.sh deb "$VERSION" "$RELEASE"
      # Package, CPU, GPU and audio checks share the image but report failures
      # independently, so an installer failure does not hide later diagnostics.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        id: models
        with:
          path: build/acceptance-models
          key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Prepare checksum-pinned public model fixtures
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        id: fixtures
        run: |
          python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output test-results/model-download
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' && steps.models.outputs.cache-hit != 'true' }}
        with:
          path: build/acceptance-models
          key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
      - name: Real CPU model, helper, citation and cancellation gates
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          mkdir -p test-results/models test-results/virtual-audio
          chmod 0777 test-results/models test-results/virtual-audio
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/test-results/models:/reports" \
            foresight-integration:local python3 tools/integration_gates.py --suite models \
            --bundle dist/open-foresight --models /models --output /reports
      - name: Shipped GPU runtimes on software Vulkan
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          mkdir -p test-results/software-gpu
          chmod 0777 test-results/software-gpu
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/test-results/software-gpu:/reports" \
            foresight-integration:local python3 tools/accept_software_gpu.py --allow-unavailable \
            --bundle dist/open-foresight --models /models --output /reports
      - name: Private virtual-audio and device-recovery gates
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          mkdir -p test-results/virtual-audio
          chmod 0777 test-results/virtual-audio
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/acceptance-models:/models:ro" -v "$PWD/test-results/virtual-audio:/reports" \
            foresight-integration:local dbus-run-session -- python3 tools/integration_gates.py --suite virtual-audio \
            --bundle dist/open-foresight --models /models --output /reports
      - name: Retain explicit integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-acceptance-evidence
          path: test-results/
