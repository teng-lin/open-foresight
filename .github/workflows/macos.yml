name: Platform candidates and checks
run-name: ${{ inputs.request_id && format('Release candidate {0}', inputs.request_id) || format('Platform checks {0}', github.ref_name) }}
permissions:
  contents: read
  actions: read
env:
  RELEASE_SOURCE_FLOOR: ${{ vars.RELEASE_SOURCE_FLOOR }}
concurrency:
  group: platform-checks-${{ github.workflow }}-${{ inputs.request_id || (inputs.preview && format('preview-{0}', github.run_id) || (github.event_name == 'pull_request' && github.ref || inputs.source || github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      bundle_id: ${{ steps.macos-candidate.outputs.artifact-id }}
      bundle_digest: ${{ steps.macos-candidate.outputs.artifact-digest }}
      attempt: ${{ steps.macos-receipt.outputs.attempt }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      FORESIGHT_BUILD_JOBS: '3'
      FORESIGHT_PARALLEL_GATES: '1'
      FORESIGHT_COVERAGE: ${{ (inputs.tier == 'release' || inputs.macos_coverage) && github.event_name != 'pull_request' && '1' || '0' }}
      FORESIGHT_CORE_COVERAGE_MIN: '0'
      FORESIGHT_HELPER: ${{ github.workspace }}/build/services/helper/ForesightHelper
      FORESIGHT_MACOS_UI_TEST: '1'
      FORESIGHT_REQUIRE_NATIVE_UI_TEST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-macos-stage
      with:
        source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        own-pr: ${{ github.event.pull_request.number || 0 }}
        version: ${{ inputs.version || needs.distribution-number.outputs.version }}
        build-number: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
        label: ${{ inputs.label }}
    - name: Run macOS source and SDK contracts
      run: .venv/bin/python tools/platform_python_tests.py --platform macos
    - name: Build and test the complete macOS application once
      run: |
        task_cmake_args=(
          -G Ninja
          "-DCMAKE_PREFIX_PATH=$PWD/build/sdk"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_ARCHITECTURES=arm64
          "-DICU_ROOT=$(brew --prefix icu4c)"
          '-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local'
        )
        # Qualify resolved dependency roots before compiling any application code.
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          "-DPython3_EXECUTABLE=$PWD/.venv/bin/python" "${task_cmake_args[@]}"
        .venv/bin/python tools/verify_macos_cmake_cache.py build/CMakeCache.txt \
          --sdk build/sdk --icu "$(brew --prefix icu4c)"
        tools/build.sh --platform macos --stage all "${task_cmake_args[@]}"
    - name: Fetch verified macos-runtime
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        ALLOW_LOCAL_BUILD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
      run: |-
        args=()
        if [[ "$ALLOW_LOCAL_BUILD" == true ]]; then args+=(--allow-local-build); fi
        python tools/ci_macos_dependencies.py --component macos-runtime --prefix build/macos-runtimes --own-head "$OWN_HEAD" --own-pr "$OWN_PR" "${args[@]}"
        python tools/ci_verify_dependency.py --component macos-runtime --prefix build/macos-runtimes
    - name: Assemble complete ad hoc application
      env:
        FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
        FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        FORESIGHT_QUERY_TERMS_URL: ${{ vars.FORESIGHT_QUERY_TERMS_URL }}
        FORESIGHT_GOOGLE_CLIENT_JSON: ${{ secrets.FORESIGHT_GOOGLE_CLIENT_JSON }}
        REQUIRE_GOOGLE_CLIENT: ${{ github.ref == 'refs/heads/main' }}
      run: |
        task_args=()
        if [[ "$REQUIRE_GOOGLE_CLIENT" == 'true' ]]; then task_args+=(--require-google-client); fi
        .venv/bin/python tools/package_macos.py "${task_args[@]}" --output 'dist/Open Foresight.app' --identity - --sdk build/sdk \
          --litert-extensions-manifest build/macos-runtimes/litert-extensions/build-manifest.json \
          --whisper-runtime build/macos-runtimes/whisper/whisper-cli \
          --whisper-license build/macos-runtimes/whisper/LICENSE
        codesign --verify --deep --strict --verbose=2 'dist/Open Foresight.app'
        if [[ -n "$FORESIGHT_GOOGLE_CLIENT_JSON" ]]; then
          task_resources="$PWD/dist/Open Foresight.app/Contents/Resources"
          (cd packages/foresight_core && env -u FORESIGHT_GOOGLE_CLIENT_JSON \
            FORESIGHT_RESOURCES="$task_resources" dart run tool/verify_google_configuration.dart)
        fi
    - name: Verify bundled inference without developer environment
      run: |
        .venv/bin/python tools/verify_macos_release_runtime.py 'dist/Open Foresight.app' \
          --output test-results/macos-release-runtime.json
    - name: Installed application tooling tests
      run: .venv/bin/python -m unittest tests.test_macos_tools.CompiledMacComponentTests -v
    - name: Relocated application MCP smoke with minimal environment
      run: |
        .venv/bin/python tools/smoke_macos_bundle.py 'dist/Open Foresight.app' \
          --expected-revision "$(git rev-parse HEAD)" \
          --output test-results/macos-bundle.json
    - name: Retain development package evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-development-evidence
        overwrite: true
        path: |
          dist/*.manifest.json
          build/macos-runtimes/runtime-manifest.json
          build/Testing/Temporary/LastTest.log
          test-results/
          coverage/
          apps/desktop/coverage/lcov.info
        if-no-files-found: ignore
    - name: Archive the exact tested application candidate
      id: macos-receipt
      env:
        PREVIEW: ${{ inputs.preview }}
        CI_TIER: release
        SOURCE: ${{ inputs.source || github.sha }}
      if: github.ref == 'refs/heads/main' && (inputs.tier == 'release' || inputs.preview)
      run: |-
        mkdir -p build/candidate
        ditto -c -k --keepParent 'dist/Open Foresight.app' build/candidate/Open-Foresight-macos-arm64.zip
        cp 'dist/Open Foresight.manifest.json' build/candidate/
        if [[ "$PREVIEW" != true ]]; then
          python tools/ci_artifacts.py pack --component macos-app --identity "$SOURCE" --prefix build/candidate --output build/candidate-upload --tier "$CI_TIER" --label ""
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        fi
    - id: macos-candidate
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.ref == 'refs/heads/main' && inputs.tier == 'release' && !inputs.preview
      with:
        name: ci-macos-app-${{ inputs.source }}
        overwrite: true
        path: build/candidate-upload/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
    - name: Publish small macos candidate identity receipt
      if: inputs.tier == 'release' && github.ref == 'refs/heads/main' && !inputs.preview
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
        ARTIFACT_ID: ${{ steps.macos-candidate.outputs.artifact-id }}
      run: python tools/ci_artifacts.py publish-receipt --component macos-app --identity "$SOURCE" --prefix build/candidate-upload --artifact-id "$ARTIFACT_ID" --output build/candidate-receipt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.tier == 'release' && github.ref == 'refs/heads/main' && !inputs.preview
      with:
        name: receipt-ci-macos-app-${{ inputs.source || github.sha }}
        overwrite: true
        path: build/candidate-receipt/
        retention-days: 90
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.preview
      with:
        name: preview-macos-application
        overwrite: true
        path: build/candidate/
        retention-days: 14
        if-no-files-found: error
        compression-level: 0
    needs:
    - changes
    - distribution-number
    if: '!cancelled() && needs.changes.outputs.macos == ''true'' && (inputs.tier != ''release'' || needs.distribution-number.result == ''success'')'
  sanitizers:
    if: inputs.tier == 'release'
    uses: ./.github/workflows/native-sanitizers.yml
    with:
      source: ${{ inputs.source }}
      consume_only: true
  linux-native:
    needs: changes
    if: inputs.tier != 'release' && needs.changes.outputs.linux_build == 'true'
    uses: ./.github/workflows/linux-platform-stages.yml
    with:
      source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      own_pr: ${{ github.event.pull_request.number || 0 }}
      event: ${{ github.event_name }}
      release: ${{ inputs.preview || github.ref == 'refs/heads/main' }}
      core_coverage_benchmark: ${{ inputs.core_coverage_benchmark || false }}
  linux-document-imports:
    needs: changes
    if: needs.changes.outputs.linux_document_imports == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - name: Install document extractors and host policy tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils unrtf apparmor
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v2
        restore-keys: flutter-linux-document-host-3.35.7-v1
    - name: Install pinned Dart through the reviewed Flutter SDK
      run: |
        task_document_flutter="$RUNNER_TEMP/foresight-document-flutter"
        if [[ ! -x "$task_document_flutter/bin/flutter" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$task_document_flutter"
        fi
        test "$(git -C "$task_document_flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo "$task_document_flutter/bin" >> "$GITHUB_PATH"
        "$task_document_flutter/bin/dart" --disable-analytics
    - name: Resolve locked core dependencies
      working-directory: packages/foresight_core
      run: dart pub get --enforce-lockfile
    - name: Require real PDF and RTF imports through the shipped sandbox
      run: bash tools/ci_document_sandbox.sh
    - name: Retain document sandbox evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-document-sandbox-evidence
        overwrite: true
        path: test-results/document-sandbox/
        if-no-files-found: error
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.changes.outputs.selection }}
      macos: ${{ steps.changes.outputs.macos }}
      linux_build: ${{ steps.changes.outputs.linux_build }}
      linux_test: ${{ steps.changes.outputs.linux_test }}
      linux_document_imports: ${{ steps.changes.outputs.linux_document_imports }}
      packaging: ${{ steps.changes.outputs.packaging }}
      dmg: ${{ steps.changes.outputs.dmg }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require a reviewed main source for distribution overrides
      if: inputs.source != ''
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "${#SOURCE}" = 40
        [[ "$SOURCE" =~ ^[0-9a-f]+$ ]]
        git merge-base --is-ancestor "$SOURCE" origin/main
    - name: Require the release-tier interface before selecting producers
      env:
        TIER: ${{ inputs.tier }}
        SOURCE: ${{ inputs.source }}
        REQUEST_ID: ${{ inputs.request_id }}
        PREVIEW: ${{ inputs.preview }}
        BUILD_LABEL: ${{ inputs.label }}
      run: |
        if [[ -n "$TIER" ]]; then
          test "$TIER" = release
          test "$GITHUB_REF" = refs/heads/main
          test -n "$SOURCE"
          test -n "$REQUEST_ID"
          test "$PREVIEW" != true
          test -z "$BUILD_LABEL"
        fi
    - name: Select affected platform checks
      id: changes
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        PUSH_BASE: ${{ github.event.before }}
        EVENT: ${{ github.event_name }}
        FORCE: ${{ (inputs.tier == 'release' || inputs.preview || github.event_name == 'workflow_dispatch') && '--force' || '' }}
      run: |-
        if [[ "$EVENT" == pull_request ]]; then
          BASE=$(git merge-base "$BASE" HEAD)
        elif [[ "$EVENT" == push ]]; then
          if [[ "$PUSH_BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$PUSH_BASE" HEAD; then
            BASE=$PUSH_BASE
          else
            echo 'Push base is unavailable or unrelated; run all selected platform suites' >&2
            BASE=HEAD
            FORCE=--force
          fi
        fi
        task_args=(--base "$BASE")
        if [[ "$FORCE" == --force ]]; then
          task_args+=(--force)
        fi
        python tools/ci_changes.py "${task_args[@]}"
    - name: Retain platform selection
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-selection-platform
        overwrite: true
        path: ci-selection.json
        if-no-files-found: error
    - name: Observe acceptance dependencies without skipping phases
      continue-on-error: true
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        EVENT: ${{ github.event_name }}
      run: python3 tools/ci_acceptance_plan.py --base "$BASE" --event "$EVENT" --output test-results/acceptance-selection.json
    - name: Retain acceptance dependency observations
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: acceptance-selection-observation
        overwrite: true
        path: test-results/acceptance-selection.json
        if-no-files-found: error
        retention-days: 30
    - name: Validate release version copies
      run: python tools/app_version.py --check
  workflow-lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - name: Require ShellCheck for embedded workflow scripts
      run: command -v shellcheck
    - name: Lint every Actions workflow
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  distribution-number:
    timeout-minutes: 5
    needs: changes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) && inputs.tier == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.number.outputs.version }}
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Allocate one build number for both platforms
      id: number
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: |
        python -m tools.candidate_identity --source "$SOURCE"
  dmg:
    needs: changes
    if: needs.changes.outputs.dmg == 'true'
    uses: ./.github/workflows/dmg-contracts.yml
    with:
      source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
  packaging:
    needs: [changes, linux-build]
    if: "!cancelled() && needs.changes.outputs.packaging == 'true' && contains(fromJSON('[\"success\",\"skipped\"]'), needs.linux-build.result)"
    uses: ./.github/workflows/package-contracts.yml
    with:
      source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      bundle_id: ${{ needs.linux-build.outputs.bundle_id }}
      bundle_digest: ${{ needs.linux-build.outputs.bundle_digest }}
      producer_attempt: ${{ needs.linux-build.outputs.attempt }}
      tier: ${{ needs.linux-build.outputs.tier }}
      label: ${{ needs.linux-build.outputs.label }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      linux_enabled: ${{ needs.changes.outputs.linux_build == 'true' }}
  linux-build:
    name: linux-build
    needs: [changes, distribution-number]
    if: "!cancelled() && needs.changes.outputs.linux_build == 'true' && (inputs.tier != 'release' || needs.distribution-number.result == 'success')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_digest: ${{ steps.bundle.outputs.artifact-digest }}
      source: ${{ steps.receipt.outputs.source }}
      tier: ${{ steps.receipt.outputs.tier }}
      label: ${{ steps.receipt.outputs.label }}
      version: ${{ steps.receipt.outputs.version }}
      build_number: ${{ steps.receipt.outputs.build_number }}
      handoff_id: ${{ steps.handoff.outputs.artifact-id }}
      handoff_digest: ${{ steps.handoff.outputs.artifact-digest }}
      attempt: ${{ steps.receipt.outputs.attempt }}
      sdk_id: ${{ steps.fork-sdk.outputs.artifact-id }}
      sdk_digest: ${{ steps.fork-sdk.outputs.artifact-digest }}
      producer_sdk_run: ${{ steps.sdk.outputs.producer_run }}
      producer_sdk_id: ${{ steps.sdk.outputs.producer_artifact_id }}
      producer_sdk_digest: ${{ steps.sdk.outputs.producer_artifact_digest }}
    steps:
    - name: Record initial shadow build storage
      run: |
        df -h / /mnt
        docker system df
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate read-only application cache access
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Validate application cache transport
      run: |
        python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY"
        python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY" --ci
    - name: Resolve verified SDKs before a component-scoped fork fallback
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        VALIDATE_SDK_TRANSPORT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:validate-sdk-transport') }}
        CI_TIER: ${{ inputs.tier || (inputs.preview && 'preview' || (github.event_name == 'pull_request' && 'pr' || 'sweep')) }}
        SHADOW_PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
      run: |
        task_args=()
        if [[ "$FORK_PR" == true ]]; then task_args+=(--fork); fi
        if [[ "$VALIDATE_SDK_TRANSPORT" == true ]]; then task_args+=(--validate-in-run-transport); fi
        python tools/ci_linux_shadow_sdk.py --source "$OWN_HEAD" --own-pr "$OWN_PR" --directory build/shadow-sdk ${task_args[@]+"${task_args[@]}"}
    - name: Retain the source-scoped in-run fork SDK
      if: steps.sdk.outputs.in_run == 'true'
      id: fork-sdk
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: shadow-sdk-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        path: build/shadow-sdk/in-run/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: true
    - name: Stamp the shadow distribution identity
      if: inputs.preview || inputs.tier == 'release'
      env:
        VERSION: ${{ inputs.version || needs.distribution-number.outputs.version }}
        BUILD_NUMBER: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
        BUILD_LABEL: ${{ inputs.label }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: python tools/preview_packages.py stamp --version "$VERSION" --build-number "$BUILD_NUMBER" --label "$BUILD_LABEL" --source "$SOURCE"
    - name: Build the exact Ubuntu application without running its suites
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        SOURCE_REVISION: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        CI_TIER: ${{ inputs.tier == 'release' && 'release' || inputs.preview && 'preview' || (github.event_name == 'pull_request' && 'pr' || 'sweep') }}
        BUILD_LABEL: ${{ inputs.label }}
        REQUIRE_GOOGLE_CLIENT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        FORESIGHT_GOOGLE_CLIENT_JSON: ${{ secrets.FORESIGHT_GOOGLE_CLIENT_JSON }}
        FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
        FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        FORESIGHT_QUERY_TERMS_URL: ${{ vars.FORESIGHT_QUERY_TERMS_URL }}
      run: bash tools/build_linux_container.sh --build-only --output build/linux-shadow
    - name: Retain the build's exact original SDK reference in its qualified bundle
      env:
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        SDK_RUN: ${{ steps.sdk.outputs.producer_run }}
        SDK_ID: ${{ steps.sdk.outputs.producer_artifact_id }}
        SDK_DIGEST: ${{ steps.sdk.outputs.producer_artifact_digest }}
        FORK_SDK_ID: ${{ steps.fork-sdk.outputs.artifact-id }}
        FORK_SDK_DIGEST: ${{ steps.fork-sdk.outputs.artifact-digest && format('sha256:{0}', steps.fork-sdk.outputs.artifact-digest) }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      run: python tools/ci_linux_sdk_reference.py write --source "$SOURCE" --reference build/linux-shadow/packages/sdk-reference.json
    - name: Bind the shadow bundle on the verified source checkout
      id: receipt
      env:
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        CI_TIER: ${{ inputs.tier == 'release' && 'release' || inputs.preview && 'preview' || (github.event_name == 'pull_request' && 'pr' || 'sweep') }}
        BUILD_LABEL: ${{ inputs.label }}
      run: |
        python tools/ci_artifacts.py pack --component linux-app --identity "$SOURCE" --prefix build/linux-shadow/packages --output build/linux-shadow/bundle-receipt --tier "$CI_TIER" --label "$BUILD_LABEL"
        {
          echo "attempt=$GITHUB_RUN_ATTEMPT"
          echo "source=$SOURCE"
          echo "tier=$CI_TIER"
          echo "label=$BUILD_LABEL"
          echo "version=$(python tools/app_version.py)"
          echo "build_number=$(python tools/app_version.py --build-number)"
        } >> "$GITHUB_OUTPUT"
    - name: Retain the exact in-run bundle without candidate naming
      id: bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.tier == 'release' && format('ci-linux-app-{0}', inputs.source) || inputs.preview && format('preview-linux-app-{0}-{1}', github.run_id, github.run_attempt) || format('linux-bundle-{0}-{1}', github.run_id, github.run_attempt) }}
        path: build/linux-shadow/bundle-receipt/
        if-no-files-found: error
        retention-days: ${{ inputs.tier == 'release' && 90 || 14 }}
        compression-level: 0
        overwrite: true
    - name: Publish original release Linux candidate identity receipt
      if: inputs.tier == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source }}
        ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
      run: python tools/ci_artifacts.py publish-receipt --component linux-app --identity "$SOURCE" --prefix build/linux-shadow/bundle-receipt --artifact-id "$ARTIFACT_ID" --output build/linux-shadow/candidate-receipt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.tier == 'release'
      with:
        name: receipt-ci-linux-app-${{ inputs.source }}
        path: build/linux-shadow/candidate-receipt/
        overwrite: true
        retention-days: 90
        if-no-files-found: error
    - name: Retain the exact source and build tree for the test runner
      id: handoff
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-src-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-shadow/handoff/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: true
    - name: Record final shadow build storage
      if: always()
      run: |
        df -h / /mnt
        docker system df
    - name: Mark successful Linux build completion
      id: complete
      run: echo 'complete=true' >> "$GITHUB_OUTPUT"
  linux-test:
    name: linux-test
    needs: linux-build
    if: "!cancelled() && needs.linux-build.result == 'success' && needs.linux-build.outputs.complete == 'true' && needs.linux-build.outputs.handoff_id != ''"
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
    - name: Record initial shadow test storage
      run: |
        df -h / /mnt
        docker system df
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Install the pinned host Docker fixture tools
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Allow isolated document namespaces in shadow test containers
      run: bash tools/ci_package_sandbox.sh
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate read-only application cache access
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Validate application cache transport
      run: |
        python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY"
        python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY" --ci
    - name: Qualify and retrieve the exact original source/build artifact
      id: handoff-proof
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        PRODUCER_ATTEMPT: ${{ needs.linux-build.outputs.attempt }}
        ARTIFACT_ID: ${{ needs.linux-build.outputs.handoff_id }}
        ARTIFACT_DIGEST: ${{ needs.linux-build.outputs.handoff_digest }}
      run: python tools/ci_linux_handoff.py qualify --directory build/linux-shadow/handoff --revision "$SOURCE" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$PRODUCER_ATTEMPT" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
    - name: Resolve the original verified shadow SDK
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        ARTIFACT_ID: ${{ needs.linux-build.outputs.sdk_id }}
        ARTIFACT_DIGEST: ${{ needs.linux-build.outputs.sdk_digest }}
        PRODUCER_ATTEMPT: ${{ needs.linux-build.outputs.attempt }}
        SDK_RUN: ${{ needs.linux-build.outputs.producer_sdk_run }}
        SDK_ID: ${{ needs.linux-build.outputs.producer_sdk_id }}
        SDK_DIGEST: ${{ needs.linux-build.outputs.producer_sdk_digest }}
      run: |
        if [[ -n "$ARTIFACT_ID" ]]; then
          python -m tools.integration_application --shadow --component linux-sdk --source "$OWN_HEAD" --head-repository "$HEAD_REPOSITORY" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --attempt "$PRODUCER_ATTEMPT" --directory build/shadow-sdk
        else
          [[ -n "$SDK_RUN" && -n "$SDK_ID" && -n "$SDK_DIGEST" ]] || { echo "Build SDK reference is missing" >&2; exit 1; }
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/shadow-sdk --run-id "$SDK_RUN" --artifact-id "$SDK_ID" --artifact-digest "$SDK_DIGEST" --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
        fi
        python tools/linux_sdk_artifacts.py resolve --prefix build/shadow-sdk --load --discard-archive
    - name: Qualify the release bundle tested by this handoff
      if: inputs.tier == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ARTIFACT_ID: ${{ needs.linux-build.outputs.bundle_id }}
        ARTIFACT_DIGEST: ${{ needs.linux-build.outputs.bundle_digest }}
        PRODUCER_ATTEMPT: ${{ needs.linux-build.outputs.attempt }}
      run: python -m tools.integration_application --source "$SOURCE" --head-repository "$HEAD_REPOSITORY" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --attempt "$PRODUCER_ATTEMPT" --directory artifacts
    - name: Test the restored bytes without rebuilding the application
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        SOURCE_REVISION: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        FORESIGHT_CONTAINER_APPARMOR: foresight-ci-document-sandbox
        FORESIGHT_CORE_COVERAGE_BENCHMARK: ${{ (inputs.core_coverage_benchmark || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:benchmark-core'))) && '1' || '0' }}
      run: bash tools/build_linux_container.sh --test-only --output build/linux-shadow
    - name: Run the real Docker cache fixture on the host
      shell: bash
      env:
        FORESIGHT_DOCKER_CACHE_TEST: '1'
        CACHE_FIXTURE_BASE: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      run: |
        # SDK archive loading does not restore the base image's own reference.
        docker image inspect "$CACHE_FIXTURE_BASE" >/dev/null 2>&1 || docker pull "$CACHE_FIXTURE_BASE"
        python -m pytest tests/test_acceptance_image_cache.py -ra
    - name: Record the verified linux-test release input after success
      if: inputs.tier == 'release'
      env:
        HANDOFF_MANIFEST_SHA256: ${{ steps.handoff-proof.outputs.manifest_sha256 }}
        HANDOFF_PRODUCER_JOB: ${{ steps.handoff-proof.outputs.producer_job }}
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      run: python tools/ci_linux_acceptance.py --record-input --gate linux-test --source "$SOURCE" --output test-results/consumption/linux-test/consumption.json --handoff build/linux-shadow/handoff --handoff-manifest-sha256 "$HANDOFF_MANIFEST_SHA256" --handoff-producer-job "$HANDOFF_PRODUCER_JOB"
    - name: Retain the actual linux-test release consumption receipt
      if: inputs.tier == 'release'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-release-input-linux-test-${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        overwrite: true
        path: test-results/consumption/linux-test/consumption.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain independent shadow test results and coverage
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ubuntu-linux-shadow-evidence
        path: build/linux-shadow/evidence/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
    - name: Record final shadow test storage
      if: always()
      run: |
        df -h / /mnt
        docker system df
    - name: Mark successful Linux test completion
      id: complete
      run: echo 'complete=true' >> "$GITHUB_OUTPUT"
  publish-caches:
    needs: linux-build
    if: "!cancelled() && inputs.tier != 'release' && github.ref == 'refs/heads/main' && contains(fromJSON('[\"push\",\"workflow_dispatch\",\"schedule\"]'), github.event_name) && needs.linux-build.result == 'success' && (inputs.source == '' || inputs.source == github.sha)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Verify current main before publishing the document toolchain cache
      id: document-current
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        case "$GITHUB_EVENT_NAME" in push|workflow_dispatch|schedule) ;; *) exit 1 ;; esac
        test "$(git rev-parse HEAD)" = "$SOURCE"
        task_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
        if [[ "$SOURCE" == "$task_main" ]]; then
          echo 'current=true' >> "$GITHUB_OUTPUT"
        else
          echo 'Main advanced; skip only the document toolchain cache work.' >&2
          echo 'current=false' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      id: document-flutter
      if: steps.document-current.outputs.current == 'true'
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v1
    - name: Install pinned Dart through the reviewed Flutter SDK
      if: steps.document-current.outputs.current == 'true'
      run: |
        task_document_flutter="$RUNNER_TEMP/foresight-document-flutter"
        if [[ ! -x "$task_document_flutter/bin/flutter" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$task_document_flutter"
        fi
        test "$(git -C "$task_document_flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo "$task_document_flutter/bin" >> "$GITHUB_PATH"
        "$task_document_flutter/bin/dart" --disable-analytics
    - name: Verify current main immediately before saving the document toolchain cache
      id: document-save-current
      if: steps.document-current.outputs.current == 'true' && steps.document-flutter.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        case "$GITHUB_EVENT_NAME" in push|workflow_dispatch|schedule) ;; *) exit 1 ;; esac
        test "$(git rev-parse HEAD)" = "$SOURCE"
        task_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
        if [[ "$SOURCE" == "$task_main" ]]; then
          echo 'current=true' >> "$GITHUB_OUTPUT"
        else
          echo 'Main advanced; skip only the document toolchain cache work.' >&2
          echo 'current=false' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: steps.document-current.outputs.current == 'true' && steps.document-flutter.outputs.cache-hit != 'true' && steps.document-save-current.outputs.current == 'true'
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v1
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate the dedicated cache publisher
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Restore a compatible verified SDK without compiling it
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.sha }}
      run: |
        python tools/ci_dependency_wait.py --component linux-sdk --prefix build/publisher-sdk --wait 1800 --own-head "$OWN_HEAD"
        python tools/linux_sdk_artifacts.py resolve --prefix build/publisher-sdk --load --discard-archive
    - name: Publish only dependency, CI-tool and acceptance-tool layers
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
      run: bash tools/publish_linux_ci_caches.sh
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      id: models
      with:
        path: build/acceptance-models
        key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
    - name: Prepare only missing checksum-pinned external models
      if: steps.models.outputs.cache-hit != 'true'
      run: python tools/test_installed_release.py --prepare-models-only --models build/acceptance-models --output test-results/model-download
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: steps.models.outputs.cache-hit != 'true'
      with:
        path: build/acceptance-models
        key: integration-models-v1-${{ hashFiles('tools/test_macos_release_models.py', 'packages/foresight_core/lib/src/model_pins.dart') }}
