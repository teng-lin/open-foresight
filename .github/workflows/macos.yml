name: Platform candidates and checks
run-name: ${{ inputs.request_id && format('Release candidate {0}', inputs.request_id) || format('Platform checks {0}', github.ref_name) }}
permissions:
  contents: read
  actions: read
concurrency:
  group: platform-checks-${{ github.workflow }}-${{ inputs.request_id || (inputs.preview && format('preview-{0}', github.run_id) || (github.event_name == 'pull_request' && github.ref || inputs.source || github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos-stages:
    needs:
    - changes
    - distribution-number
    if: '!cancelled() && needs.changes.outputs.macos == ''true'' && (inputs.preview || github.ref != ''refs/heads/main'' || needs.distribution-number.result == ''success'')'
    uses: ./.github/workflows/macos-platform-stages.yml
    with:
      source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      own_pr: ${{ github.event.pull_request.number || 0 }}
      event: ${{ github.event_name }}
      release: ${{ inputs.preview || github.ref == 'refs/heads/main' }}
      version: ${{ inputs.version || needs.distribution-number.outputs.version }}
      build_number: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
      label: ${{ inputs.label }}
      core_coverage_benchmark: ${{ inputs.core_coverage_benchmark || false }}
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      FORESIGHT_BUILD_JOBS: '3'
      FORESIGHT_PARALLEL_GATES: '1'
      FORESIGHT_COVERAGE: '1'
      FORESIGHT_CORE_COVERAGE_MIN: '90'
      FORESIGHT_HELPER: ${{ github.workspace }}/build/services/helper/ForesightHelper
      FORESIGHT_MACOS_UI_TEST: '1'
      FORESIGHT_REQUIRE_NATIVE_UI_TEST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-macos-stage
      with:
        stage: packaging
        source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        own-pr: ${{ github.event.pull_request.number || 0 }}
        version: ${{ inputs.version || needs.distribution-number.outputs.version }}
        build-number: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
        label: ${{ inputs.label }}
    - name: Download qualified native outputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.macos-stages.outputs.native_artifact_name }}
        path: build/ci-input/native
    - name: Download qualified core outputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.macos-stages.outputs.core_artifact_name }}
        path: build/ci-input/core
    - name: Download qualified desktop outputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.macos-stages.outputs.desktop_artifact_name }}
        path: build/ci-input/desktop
    - name: Validate exact-source stage receipts before packaging
      env:
        STAGE_PARENTS: '{"native":"${{ needs.macos-stages.outputs.native_identity }}","core":"${{ needs.macos-stages.outputs.core_identity }}","desktop":"${{ needs.macos-stages.outputs.desktop_identity }}"}'
      run: |-
        .venv/bin/python - <<'PYCODE'
        import json, os
        from pathlib import Path
        from tools.run_ci_stage import restore_input
        from tools.ci_stage_cache import git
        root = Path.cwd()
        source = git(root, 'rev-parse', 'HEAD').decode().strip()
        for stage, identity in json.loads(os.environ['STAGE_PARENTS']).items():
            restore_input(root, 'macos', stage, root / 'build/ci-input' / stage, identity, source)
        PYCODE
    - name: Fetch verified macos-runtime
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        ALLOW_LOCAL_BUILD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
      run: |-
        args=()
        if [[ "$ALLOW_LOCAL_BUILD" == true ]]; then args+=(--allow-local-build); fi
        python tools/ci_macos_dependencies.py --component macos-runtime --prefix build/macos-runtimes --own-head "$OWN_HEAD" --own-pr "$OWN_PR" "${args[@]}"
        python tools/ci_verify_dependency.py --component macos-runtime --prefix build/macos-runtimes
    - name: Assemble complete ad hoc application
      env:
        FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
        FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        FORESIGHT_QUERY_TERMS_URL: ${{ vars.FORESIGHT_QUERY_TERMS_URL }}
        FORESIGHT_GOOGLE_CLIENT_JSON: ${{ secrets.FORESIGHT_GOOGLE_CLIENT_JSON }}
        REQUIRE_GOOGLE_CLIENT: ${{ github.ref == 'refs/heads/main' }}
      run: |
        task_args=()
        if [[ "$REQUIRE_GOOGLE_CLIENT" == 'true' ]]; then task_args+=(--require-google-client); fi
        .venv/bin/python tools/package_macos.py "${task_args[@]}" --output 'dist/Open Foresight.app' --identity - --sdk build/sdk \
          --litert-extensions-manifest build/macos-runtimes/litert-extensions/build-manifest.json \
          --whisper-runtime build/macos-runtimes/whisper/whisper-cli \
          --whisper-license build/macos-runtimes/whisper/LICENSE
        codesign --verify --deep --strict --verbose=2 'dist/Open Foresight.app'
        if [[ -n "$FORESIGHT_GOOGLE_CLIENT_JSON" ]]; then
          task_resources="$PWD/dist/Open Foresight.app/Contents/Resources"
          (cd packages/foresight_core && env -u FORESIGHT_GOOGLE_CLIENT_JSON \
            FORESIGHT_RESOURCES="$task_resources" dart run tool/verify_google_configuration.dart)
        fi
    - name: Verify bundled inference without developer environment
      run: |
        .venv/bin/python tools/verify_macos_release_runtime.py 'dist/Open Foresight.app' \
          --output test-results/macos-release-runtime.json
    - name: Installed application tooling tests
      run: .venv/bin/python -m unittest tests.test_macos_tools.CompiledMacComponentTests -v
    - name: Relocated application MCP smoke with minimal environment
      run: |
        .venv/bin/python tools/smoke_macos_bundle.py 'dist/Open Foresight.app' \
          --expected-revision "$(git rev-parse HEAD)" \
          --output test-results/macos-bundle.json
    - name: Retain development package evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-development-evidence
        overwrite: true
        path: |
          dist/*.manifest.json
          build/macos-runtimes/runtime-manifest.json
          build/Testing/Temporary/LastTest.log
          test-results/
        if-no-files-found: ignore
    - name: Archive the exact tested application candidate
      env:
        PREVIEW: ${{ inputs.preview }}
        SOURCE: ${{ inputs.source || github.sha }}
      if: github.ref == 'refs/heads/main'
      run: |-
        mkdir -p build/candidate
        ditto -c -k --keepParent 'dist/Open Foresight.app' build/candidate/Open-Foresight-macos-arm64.zip
        cp 'dist/Open Foresight.manifest.json' build/candidate/
        if [[ "$PREVIEW" != true ]]; then
          python tools/ci_artifacts.py pack --component macos-app --identity "$SOURCE" --prefix build/candidate --output build/candidate-upload
        fi
    - id: macos-candidate
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.ref == 'refs/heads/main' && !inputs.preview
      with:
        name: ci-macos-app-${{ inputs.source || github.sha }}
        overwrite: true
        path: build/candidate-upload/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
    - name: Publish small macos candidate identity receipt
      if: github.ref == 'refs/heads/main' && !inputs.preview
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
        ARTIFACT_ID: ${{ steps.macos-candidate.outputs.artifact-id }}
      run: python tools/ci_artifacts.py publish-receipt --component macos-app --identity "$SOURCE" --prefix build/candidate-upload --artifact-id "$ARTIFACT_ID" --output build/candidate-receipt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.ref == 'refs/heads/main' && !inputs.preview
      with:
        name: receipt-ci-macos-app-${{ inputs.source || github.sha }}
        overwrite: true
        path: build/candidate-receipt/
        retention-days: 90
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.preview
      with:
        name: preview-macos-application
        overwrite: true
        path: build/candidate/
        retention-days: 14
        if-no-files-found: error
        compression-level: 0
    needs:
    - changes
    - distribution-number
    - macos-stages
    if: '!cancelled() && needs.macos-stages.result == ''success'' && needs.changes.outputs.macos == ''true'' && (inputs.preview || github.ref != ''refs/heads/main'' || needs.distribution-number.result == ''success'')'
  linux-native:
    needs: changes
    if: needs.changes.outputs.linux_native == 'true'
    uses: ./.github/workflows/linux-platform-stages.yml
    with:
      source: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      own_pr: ${{ github.event.pull_request.number || 0 }}
      event: ${{ github.event_name }}
      release: ${{ inputs.preview || github.ref == 'refs/heads/main' }}
      core_coverage_benchmark: ${{ inputs.core_coverage_benchmark || false }}
  linux-document-imports:
    needs: changes
    if: needs.changes.outputs.linux_document_imports == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - name: Install document extractors and host policy tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils unrtf apparmor
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/foresight-document-flutter
        key: flutter-linux-document-host-3.35.7-v1
    - name: Install pinned Dart through the reviewed Flutter SDK
      run: |
        task_document_flutter="$RUNNER_TEMP/foresight-document-flutter"
        if [[ ! -x "$task_document_flutter/bin/flutter" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$task_document_flutter"
        fi
        test "$(git -C "$task_document_flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo "$task_document_flutter/bin" >> "$GITHUB_PATH"
        "$task_document_flutter/bin/dart" --disable-analytics
    - name: Resolve locked core dependencies
      working-directory: packages/foresight_core
      run: dart pub get --enforce-lockfile
    - name: Require real PDF and RTF imports through the shipped sandbox
      run: bash tools/ci_document_sandbox.sh
    - name: Retain document sandbox evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-document-sandbox-evidence
        overwrite: true
        path: test-results/document-sandbox/
        if-no-files-found: error
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.changes.outputs.selection }}
      macos: ${{ steps.changes.outputs.macos }}
      linux_native: ${{ steps.changes.outputs.linux_native }}
      linux_document_imports: ${{ steps.changes.outputs.linux_document_imports }}
      linux_bundle: ${{ steps.changes.outputs.linux_bundle }}
      packaging: ${{ steps.changes.outputs.packaging }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Require a reviewed main source for distribution overrides
      if: inputs.source != ''
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        test "${#SOURCE}" = 40
        [[ "$SOURCE" =~ ^[0-9a-f]+$ ]]
        git merge-base --is-ancestor "$SOURCE" origin/main
    - name: Select affected platform checks
      id: changes
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        PLATFORMS: ${{ inputs.platforms || 'all' }}
        FORCE: ${{ (inputs.preview || github.event_name == 'workflow_dispatch') && '--force' || '' }}
      run: |-
        task_args=(--base "$BASE")
        if [[ "$FORCE" == --force ]]; then
          task_args+=(--force)
        fi
        python tools/ci_changes.py "${task_args[@]}" --platforms "$PLATFORMS"
    - name: Retain platform selection
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-selection-platform
        overwrite: true
        path: ci-selection.json
        if-no-files-found: error
    - name: Validate release version copies
      run: python tools/app_version.py --check
  workflow-lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require ShellCheck for embedded workflow scripts
      run: command -v shellcheck
    - name: Lint every Actions workflow
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  distribution-number:
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && !inputs.preview && (needs.changes.outputs.macos == 'true' || needs.changes.outputs.linux_bundle == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.number.outputs.version }}
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Allocate one build number for both platforms
      id: number
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
        PLATFORMS: ${{ inputs.platforms || 'all' }}
        REBUILD_REASON: ${{ inputs.rebuild_reason }}
      run: |
        python -m tools.candidate_identity --source "$SOURCE" --platforms "$PLATFORMS" --reason "$REBUILD_REASON"
  linux-bundle:
    needs:
    - changes
    - distribution-number
    permissions:
      contents: read
      packages: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
    - name: Record initial runner storage
      run: |
        df -h / /mnt
        docker system df
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Stamp distribution identity before building
      if: inputs.preview || github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ inputs.version || needs.distribution-number.outputs.version }}
        BUILD_NUMBER: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
        BUILD_LABEL: ${{ inputs.label }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: python tools/preview_packages.py stamp --version "$VERSION" --build-number "$BUILD_NUMBER" --label "$BUILD_LABEL" --source "$SOURCE"
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate application cache registry
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Validate shared-daemon application cache transport
      id: app-cache
      run: python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY"
    - name: Fetch verified Linux SDK descriptor
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
      run: |-
        python tools/ci_dependency_wait.py --component linux-sdk --prefix build/sdk-descriptor --wait 1800 --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
        python tools/linux_sdk_artifacts.py resolve --prefix build/sdk-descriptor --load --discard-archive
    - name: Packaging contracts
      run: python3 -m unittest discover -s tests -p test_linux_packages.py -v
    - name: Package version
      id: version
      run: |
        python3 - <<'PY'
        import os, subprocess, sys
        sys.path.insert(0, 'tools')
        from app_version import read_version, stale
        if paths := stale():
            raise SystemExit('Out of date with apps/desktop/pubspec.yaml: ' + ', '.join(paths))
        version, _ = read_version()
        release = '1'
        epoch = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'version={version}\nrelease={release}\nepoch={epoch}\n')
        PY
    - name: Restore qualified application dependency outputs without compilation
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
      run: python tools/ci_app_dependency_seed.py --sdk-image "$SDK_IMAGE" --output build/app-dependency-seed
    - name: Retain dependency reuse provenance
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ubuntu-dependency-qualification-${{ github.job }}
        overwrite: true
        path: build/app-dependency-seed/qualification.json
        if-no-files-found: error
        retention-days: 30
    - name: Publish only the secret-free application dependency cache
      if: github.ref == 'refs/heads/main' && inputs.source == ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/build.Dockerfile
        build-contexts: appdeps_seed=./build/app-dependency-seed
        builder: ${{ steps.app-cache.outputs.builder }}
        target: application-dependencies
        build-args: |
          SDK_IMAGE=${{ steps.sdk.outputs.image }}
          REQUIRE_DEPENDENCY_REUSE=1
        cache-from: |
          type=registry,ref=${{ steps.app-cache.outputs.legacy_cache }}
          type=registry,ref=${{ steps.app-cache.outputs.cache }}
        cache-to: ${{ format('type=registry,ref={0},mode=max,image-manifest=true', steps.app-cache.outputs.cache) }}
    - name: Validate acceptance tools cache transport
      if: github.ref == 'refs/heads/main' && inputs.source == ''
      id: acceptance-cache
      run: python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY" --acceptance
    - name: Publish reusable acceptance dependencies without application compilation
      # Historical product overrides retain their original Dockerfile recipe.
      if: github.ref == 'refs/heads/main' && inputs.source == ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/acceptance.Dockerfile
        target: acceptance-dependencies
        builder: ${{ steps.acceptance-cache.outputs.builder }}
        build-args: SDK_IMAGE=${{ steps.sdk.outputs.image }}
        cache-from: |
          type=registry,ref=${{ steps.acceptance-cache.outputs.legacy_cache }}
          type=registry,ref=${{ steps.acceptance-cache.outputs.cache }}
        cache-to: ${{ format('type=registry,ref={0},mode=max,image-manifest=true', steps.acceptance-cache.outputs.cache) }}
    - name: Build and test the current application without exporting its layers
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/build.Dockerfile
        build-contexts: appdeps_seed=./build/app-dependency-seed
        builder: ${{ steps.app-cache.outputs.builder }}
        target: tested
        build-args: |
          SDK_IMAGE=${{ steps.sdk.outputs.image }}
          REQUIRE_DEPENDENCY_REUSE=1
          SOURCE_REVISION=${{ inputs.source || github.sha }}
        cache-from: |
          type=registry,ref=${{ steps.app-cache.outputs.legacy_cache }}
          type=registry,ref=${{ steps.app-cache.outputs.cache }}
    - name: Assemble and verify distribution bundle
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: packaging/build.Dockerfile
        build-contexts: appdeps_seed=./build/app-dependency-seed
        builder: ${{ steps.app-cache.outputs.builder }}
        target: artifact
        outputs: type=local,dest=build/portable
        build-args: |
          SDK_IMAGE=${{ steps.sdk.outputs.image }}
          REQUIRE_DEPENDENCY_REUSE=1
          SOURCE_REVISION=${{ inputs.source || github.sha }}
          REQUIRE_GOOGLE_CLIENT=1
          DISTRIBUTION_CONFIG_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
        secrets: |
          google_client=${{ secrets.FORESIGHT_GOOGLE_CLIENT_JSON }}
          foresight_search_api_key=${{ secrets.FORESIGHT_SEARCH_API_KEY }}
          foresight_web_content_api_key=${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        cache-from: |
          type=registry,ref=${{ steps.app-cache.outputs.legacy_cache }}
          type=registry,ref=${{ steps.app-cache.outputs.cache }}
    - name: Archive executable permissions and record checksums
      env:
        VERSION: ${{ inputs.preview && format('{0}~{1}', inputs.version, inputs.label) || steps.version.outputs.version }}
        RELEASE: ${{ steps.version.outputs.release }}
        SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
      run: |
        python3 packaging/package_linux.py --bundle build/portable/dist/open-foresight --format tar --version "$VERSION" --release "$RELEASE"
        cp build/portable/dist/abi.json dist/packages/abi.json
    - name: Archive exact tested Linux candidate
      if: ${{ !inputs.preview }}
      env:
        SOURCE: ${{ inputs.source || github.sha }}
      run: python tools/ci_artifacts.py pack --component linux-app --identity "$SOURCE" --prefix dist/packages --output build/candidate-upload
    - id: linux-candidate
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ !inputs.preview }}
      with:
        name: ci-linux-app-${{ inputs.source || github.sha }}
        overwrite: true
        path: build/candidate-upload/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
    - name: Publish small linux candidate identity receipt
      if: github.ref == 'refs/heads/main' && !inputs.preview
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.sha }}
        ARTIFACT_ID: ${{ steps.linux-candidate.outputs.artifact-id }}
      run: python tools/ci_artifacts.py publish-receipt --component linux-app --identity "$SOURCE" --prefix build/candidate-upload --artifact-id "$ARTIFACT_ID" --output build/candidate-receipt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.ref == 'refs/heads/main' && !inputs.preview
      with:
        name: receipt-ci-linux-app-${{ inputs.source || github.sha }}
        overwrite: true
        path: build/candidate-receipt/
        retention-days: 90
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: inputs.preview
      with:
        name: preview-linux-portable
        overwrite: true
        path: dist/packages/
        retention-days: 14
        if-no-files-found: error
        compression-level: 0
    - name: Record final runner storage
      if: always()
      run: |
        df -h / /mnt
        docker system df
    if: '!cancelled() && needs.changes.outputs.linux_bundle == ''true'' && github.ref == ''refs/heads/main'' && (inputs.preview || needs.distribution-number.result == ''success'')'
  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/package-contracts.yml
  linux-build:
    name: linux-build
    needs: [changes, distribution-number]
    if: "!cancelled() && needs.changes.outputs.linux_native == 'true' && (inputs.preview || github.ref != 'refs/heads/main' || needs.distribution-number.result == 'success')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      handoff_id: ${{ steps.handoff.outputs.artifact-id }}
      handoff_digest: ${{ steps.handoff.outputs.artifact-digest }}
      attempt: ${{ steps.receipt.outputs.attempt }}
      sdk_id: ${{ steps.fork-sdk.outputs.artifact-id }}
      sdk_digest: ${{ steps.fork-sdk.outputs.artifact-digest }}
    steps:
    - name: Record initial shadow build storage
      run: |
        df -h / /mnt
        docker system df
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate read-only application cache access
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Validate application cache transport
      run: python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY"
    - name: Resolve verified SDKs before a component-scoped fork fallback
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        task_args=()
        if [[ "$FORK_PR" == true ]]; then task_args+=(--fork); fi
        python tools/ci_linux_shadow_sdk.py --source "$OWN_HEAD" --own-pr "$OWN_PR" --directory build/shadow-sdk ${task_args[@]+"${task_args[@]}"}
    - name: Retain the source-scoped in-run fork SDK
      if: steps.sdk.outputs.in_run == 'true'
      id: fork-sdk
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: shadow-sdk-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        path: build/shadow-sdk/in-run/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: true
    - name: Stamp the shadow distribution identity
      if: inputs.preview || github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ inputs.version || needs.distribution-number.outputs.version }}
        BUILD_NUMBER: ${{ inputs.build_number || needs.distribution-number.outputs.build_number }}
        BUILD_LABEL: ${{ inputs.label }}
        SOURCE: ${{ inputs.source || github.sha }}
      run: python tools/preview_packages.py stamp --version "$VERSION" --build-number "$BUILD_NUMBER" --label "$BUILD_LABEL" --source "$SOURCE"
    - name: Build the exact Ubuntu application without running its suites
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        SOURCE_REVISION: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        CI_TIER: ${{ inputs.preview && 'preview' || (github.event_name == 'pull_request' && 'pr' || 'sweep') }}
        BUILD_LABEL: ${{ inputs.label }}
        REQUIRE_GOOGLE_CLIENT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        FORESIGHT_GOOGLE_CLIENT_JSON: ${{ secrets.FORESIGHT_GOOGLE_CLIENT_JSON }}
        FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
        FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        FORESIGHT_QUERY_TERMS_URL: ${{ vars.FORESIGHT_QUERY_TERMS_URL }}
      run: bash tools/build_linux_container.sh --build-only --output build/linux-shadow
    - name: Bind the shadow bundle on the verified source checkout
      id: receipt
      env:
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        CI_TIER: ${{ inputs.preview && 'preview' || (github.event_name == 'pull_request' && 'pr' || 'sweep') }}
        BUILD_LABEL: ${{ inputs.label }}
      run: |
        python tools/ci_artifacts.py pack --component linux-app --identity "$SOURCE" --prefix build/linux-shadow/packages --output build/linux-shadow/bundle-receipt --tier "$CI_TIER" --label "$BUILD_LABEL"
        echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Retain the exact shadow bundle without candidate naming
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-shadow/bundle-receipt/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: true
    - name: Retain the exact source and build tree for the test runner
      id: handoff
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-src-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-shadow/handoff/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        overwrite: true
    - name: Record final shadow build storage
      if: always()
      run: |
        df -h / /mnt
        docker system df
  linux-test:
    name: linux-test
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
    - name: Record initial shadow test storage
      run: |
        df -h / /mnt
        docker system df
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Install the pinned host Docker fixture tools
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Allow isolated document namespaces in shadow test containers
      run: bash tools/ci_package_sandbox.sh
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
      with:
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Authenticate read-only application cache access
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Validate application cache transport
      run: python tools/ci_app_build_transport.py --repository "$GITHUB_REPOSITORY"
    - name: Qualify and retrieve the exact original source/build artifact
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        PRODUCER_ATTEMPT: ${{ needs.linux-build.outputs.attempt }}
        ARTIFACT_ID: ${{ needs.linux-build.outputs.handoff_id }}
        ARTIFACT_DIGEST: ${{ needs.linux-build.outputs.handoff_digest }}
      run: python tools/ci_linux_handoff.py qualify --directory build/linux-shadow/handoff --revision "$SOURCE" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$PRODUCER_ATTEMPT" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
    - name: Resolve the original verified shadow SDK
      id: sdk
      env:
        GH_TOKEN: ${{ github.token }}
        OWN_HEAD: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        OWN_PR: ${{ github.event.pull_request.number || 0 }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        ARTIFACT_ID: ${{ needs.linux-build.outputs.sdk_id }}
        ARTIFACT_DIGEST: ${{ needs.linux-build.outputs.sdk_digest }}
        PRODUCER_ATTEMPT: ${{ needs.linux-build.outputs.attempt }}
      run: |
        if [[ -n "$ARTIFACT_ID" ]]; then
          python -m tools.integration_application --shadow --component linux-sdk --source "$OWN_HEAD" --head-repository "$HEAD_REPOSITORY" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --attempt "$PRODUCER_ATTEMPT" --directory build/shadow-sdk
        else
          python tools/ci_artifacts.py pull --component linux-sdk --prefix build/shadow-sdk --wait 1800 --own-head "$OWN_HEAD" --own-pr "$OWN_PR"
        fi
        python tools/linux_sdk_artifacts.py resolve --prefix build/shadow-sdk --load --discard-archive
    - name: Test the restored bytes without rebuilding the application
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.sdk.outputs.image }}
        SOURCE_REVISION: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        FORESIGHT_CONTAINER_APPARMOR: foresight-ci-document-sandbox
        FORESIGHT_CORE_COVERAGE_BENCHMARK: ${{ inputs.core_coverage_benchmark && '1' || '0' }}
      run: bash tools/build_linux_container.sh --test-only --output build/linux-shadow
    - name: Run the real Docker cache fixture on the host
      env:
        FORESIGHT_DOCKER_CACHE_TEST: '1'
      run: python -m pytest tests/test_acceptance_image_cache.py -ra
    - name: Retain independent shadow test results and coverage
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ubuntu-linux-shadow-evidence
        path: build/linux-shadow/evidence/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
    - name: Record final shadow test storage
      if: always()
      run: |
        df -h / /mnt
        docker system df
  linux-shadow-comparison:
    needs: [linux-native, linux-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Retrieve this run's Arch results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: linux-*-evidence
        path: build/shadow-compare/arch
    - name: Retrieve this run's independent Ubuntu results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ubuntu-linux-shadow-evidence
        path: build/shadow-compare/ubuntu
    - name: Require equivalent complete per-test outcomes
      run: python tools/ci_linux_shadow_compare.py --arch build/shadow-compare/arch --ubuntu build/shadow-compare/ubuntu --output test-results/linux-shadow-comparison.json
    - name: Retain the measured suite counts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-shadow-comparison
        path: test-results/linux-shadow-comparison.json
        overwrite: true
        if-no-files-found: warn
        retention-days: 30
  platform-checks:
    timeout-minutes: 5
    if: always()
    needs:
    - changes
    - workflow-lint
    - macos
    - macos-stages
    - linux-native
    - linux-document-imports
    - linux-bundle
    - packaging
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require all selected platform gates
      env:
        NEEDS: ${{ toJSON(needs) }}
        SELECTION: ${{ needs.changes.outputs.selection }}
        MAIN: ${{ github.ref == 'refs/heads/main' }}
        WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
      run: |
        test "$WORKFLOW_LINT" = success
        python tools/ci_changes.py --check-gates
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch:
    inputs:
      core_coverage_benchmark:
        description: Compare full macOS core plain and covered with full Linux core coverage
        type: boolean
        default: false
      rebuild_reason:
        description: Exact output-affecting input change requiring replacement of an existing candidate
        type: string
        default: ''
      platforms:
        description: Build only the affected or missing platform
        type: choice
        options: [all, linux, macos]
        default: all
      request_id:
        description: Unique release coordinator request; leave empty for manual builds
        type: string
        default: ''
      source:
        description: Reviewed main commit to build; empty means the dispatch commit
        type: string
        default: ''
  workflow_call:
    inputs:
      core_coverage_benchmark:
        type: boolean
        default: false
      request_id:
        type: string
        default: ''
      preview:
        type: boolean
        default: false
      source:
        type: string
        default: ''
      version:
        type: string
        default: ''
      build_number:
        type: string
        default: ''
      label:
        type: string
        default: ''
