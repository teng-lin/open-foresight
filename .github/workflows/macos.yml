name: Mac service worker exit diagnostics
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: service-worker-diagnostic-${{ github.sha }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Install compiler and locked Python tools
      run: |
        brew install cmake ninja git-lfs
        python -m venv .venv
        .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-macos-arm64-3.35.7-v1
    - name: Install pinned Dart SDK through Flutter
      run: |
        if [[ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        fi
        test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
    - name: Fetch verified native SDK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python tools/ci_artifacts.py pull --component macos-sdk --prefix build/sdk --wait 300 --own-head "$GITHUB_SHA"
        python tools/ci_verify_dependency.py --component macos-sdk --prefix build/sdk
        echo "$GITHUB_WORKSPACE/build/sdk/bin" >> "$GITHUB_PATH"
    - name: Build only helper, native bridge and service
      run: |
        cmake -S services/helper -B build/helper -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$PWD/build/sdk" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_IGNORE_PREFIX_PATH='/opt/homebrew;/usr/local' -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
        cmake --build build/helper --parallel 3
        cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
        cmake --build build/native --parallel 3
        mkdir -p build/application
        cd packages/foresight_core
        dart pub get --enforce-lockfile
        dart compile exe bin/service.dart -o ../../build/application/foresight-service
    - name: Repeat strict adopted-helper exit cases with worker traces
      env:
        FORESIGHT_HELPER_EXECUTABLE: ${{ github.workspace }}/build/helper/ForesightHelper
        FORESIGHT_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/libforesight_native.dylib
        FORESIGHT_SERVICE_EXECUTABLE: ${{ github.workspace }}/build/application/foresight-service
      run: |
        set -euo pipefail
        for task_trial in $(seq 1 50); do
          echo "Adopted-helper diagnostic trial $task_trial"
          task_service_temp=$(mktemp -d /tmp/of-svc.XXXXXX)
          .venv/bin/python -m pytest tests/service/test_service_process.py -k 'real_adopted_helper and True' --basetemp "$task_service_temp" -v
          rm -rf -- "$task_service_temp"
        done
