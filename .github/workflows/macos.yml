        producer-sdk-id: ${{ needs.linux-build.outputs.producer_sdk_id }}
        producer-sdk-digest: ${{ needs.linux-build.outputs.producer_sdk_digest }}
        own-pr: ${{ github.event.pull_request.number || 0 }}
        label: ${{ inputs.label }}
    - name: Run independent deb acceptance against the restored bytes
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_IMAGE: ${{ steps.consumer.outputs.image }}
        VERSION: ${{ steps.consumer.outputs.version }}
        ACCEPTANCE_FULL: ${{ inputs.tier == 'release' || inputs.acceptance == 'full' }}
        PACKAGING_SELECTED: ${{ needs.changes.outputs.packaging }}
      run: bash tools/linux_acceptance.sh deb
    - name: Record the verified acceptance-deb release input after success
      if: inputs.tier == 'release'
      env:
        SOURCE: ${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
      run: python tools/ci_linux_acceptance.py --record-input --gate acceptance-deb --source "$SOURCE" --output test-results/consumption/acceptance-deb/consumption.json
    - name: Retain the actual acceptance-deb release consumption receipt
      if: inputs.tier == 'release'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-release-input-acceptance-deb-${{ inputs.source || github.event.pull_request.head.sha || github.sha }}
        overwrite: true
        path: test-results/consumption/acceptance-deb/consumption.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain independent deb acceptance evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: acceptance-deb-evidence
        overwrite: true
        path: |
          test-results/
          artifacts/*.build.json
          artifacts/source-qualification.json
          artifacts/distribution-stamp.json
          dist/packages/*.build.json
        if-no-files-found: warn
        retention-days: 30
  acceptance-checks:
    if: always()
    needs: [changes, linux-build, acceptance-cpu, acceptance-audio, acceptance-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - name: Require every selected acceptance consumer and successful producer
      env:
        NEEDS: ${{ toJSON(needs) }}
        SELECTED: ${{ needs.changes.outputs.linux_build }}
      run: python3 tools/ci_linux_acceptance.py --check-gates
  platform-checks:
    timeout-minutes: 5
    if: always()
    needs:
    - changes
    - workflow-lint
    - linux-native
    - dmg
    - macos
    - linux-build
    - linux-test
    - linux-document-imports
    - packaging
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ inputs.source || github.sha }}
    - name: Require all selected platform gates
      env:
        NEEDS: ${{ toJSON(needs) }}
        SELECTION: ${{ needs.changes.outputs.selection }}
        WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
        CI_TIER: ${{ inputs.tier }}
      run: |
        test "$WORKFLOW_LINT" = success
        python tools/ci_changes.py --check-gates
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch:
    inputs:
      acceptance:
        description: Standard portable acceptance or full external and Debian 13 coverage
        type: choice
        options: [standard, full]
        default: standard
      core_coverage_benchmark:
        description: Compare full Linux core plain and covered test execution
        type: boolean
        default: false
      source:
        description: Reviewed main commit to build; empty means the dispatch commit
        type: string
        default: ''
  workflow_call:
    outputs:
      macos_bundle_id:
        description: Original macOS candidate artifact ID
        value: ${{ jobs.macos.outputs.bundle_id }}
      macos_bundle_digest:
        description: Original macOS candidate uploaded ZIP SHA-256
        value: ${{ jobs.macos.outputs.bundle_digest }}
      macos_bundle_attempt:
        description: Original successful macOS producer attempt
        value: ${{ jobs.macos.outputs.attempt }}
      source:
        description: Exact Linux application source
        value: ${{ jobs.linux-build.outputs.source }}
      version:
        description: Numeric application version before preview label
        value: ${{ jobs.linux-build.outputs.version }}
      build_number:
        description: Embedded application build number
        value: ${{ jobs.linux-build.outputs.build_number }}
      linux_bundle_id:
        description: Exact in-run Linux bundle artifact ID
        value: ${{ jobs.linux-build.outputs.bundle_id }}
      linux_bundle_digest:
        description: Exact uploaded ZIP SHA-256, bare hexadecimal
        value: ${{ jobs.linux-build.outputs.bundle_digest }}
      linux_bundle_attempt:
        description: Original successful producer attempt
        value: ${{ jobs.linux-build.outputs.attempt }}
    inputs:
      macos_coverage:
        description: Collect non-gating nightly macOS coverage
        type: boolean
        default: false
      acceptance:
        type: string
        default: standard
      tier:
        type: string
        default: ''
      core_coverage_benchmark:
        type: boolean
        default: false
      request_id:
        type: string
        default: ''
      preview:
        type: boolean
        default: false
      source:
        type: string
        default: ''
      version:
        type: string
        default: ''
      build_number:
        type: string
        default: ''
      label:
        type: string
        default: ''
