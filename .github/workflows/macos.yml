name: Mac support and Linux native regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      FORESIGHT_SEARCH_API_KEY:
        required: false
      FORESIGHT_WEB_CONTENT_API_KEY:
        required: false
    inputs:
      package-release:
        description: Archive the tested application for the release DMG workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # GitHub's standard macos-15 label is Apple Silicon; Intel has its own
    # macos-15-intel label. Fail early if runner allocation ever changes.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      FORESIGHT_BUILD_JOBS: '3'
      FORESIGHT_COVERAGE: '1'
      FORESIGHT_CORE_COVERAGE_MIN: '90'
      FORESIGHT_HELPER: ${{ github.workspace }}/build/services/helper/ForesightHelper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release version
        if: inputs.package-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/app_version.py --check
          version=$(python3 tools/app_version.py)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag must match pubspec version (v$version)" >&2
            exit 1
          fi
      - name: Verify Apple Silicon host
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: brew install cmake ninja cocoapods protobuf git-lfs
      - name: Install Python development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Offline Python tests and branch coverage
        run: tools/coverage.sh
      - name: Retain Python coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage-macos
          path: coverage/python/
          if-no-files-found: warn
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-macos-desktop --enable-swift-package-manager --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: sdk-cache
        with:
          path: build/sdk
          key: macos15-arm64-sdk-${{ hashFiles('tools/build_macos_sdk.py') }}
      - name: Verify SDK checkout guards
        run: .venv/bin/python -m pytest tests/test_macos_tools.py -k SdkSourceTests -v
      - name: Build macOS 15 compatible dependency SDK
        run: .venv/bin/python tools/build_macos_sdk.py --jobs 3
      - name: Expose SDK code generators
        run: echo "$GITHUB_WORKSPACE/build/sdk/bin" >> "$GITHUB_PATH"
      - name: Save completed dependency SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/sdk
          key: macos15-arm64-sdk-${{ hashFiles('tools/build_macos_sdk.py') }}
      - name: Native, core, service, MCP, and Flutter gates
        run: |
          tools/build.sh --platform macos \
            -DCMAKE_PREFIX_PATH="$PWD/build/sdk" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_IGNORE_PREFIX_PATH='/opt/homebrew;/usr/local'
      - name: Retain Dart core coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dart-core-coverage-macos
          path: coverage/core/lcov.info
          if-no-files-found: error
      - name: Verify native helper identity boundary
        run: |
          .venv/bin/python tests/integration/test_native_process.py \
            build/native/libforesight_native.dylib build/services/helper/ForesightHelper
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: inference-cache
        with:
          path: build/macos-runtimes
          key: macos15-arm64-inference-${{ hashFiles('tools/build_macos_runtimes.py', 'tools/build_litert_extensions.py', 'tools/litert_extensions.py', 'tools/test_litert_status_abi.py', 'requirements-litert-macos.lock', 'third_party/litert_lm/*.patch') }}
      - name: Build and verify complete inference runtimes
        run: |
          .venv/bin/python tools/build_macos_runtimes.py --jobs 3
          # The verified wheel, native regression logs and ABI report live in
          # macos-runtimes. Release compiler scratch space before app copies.
          rm -rf -- build/macos-runtime-sources
      - name: Cache verified inference runtimes
        if: steps.inference-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/macos-runtimes
          key: macos15-arm64-inference-${{ hashFiles('tools/build_macos_runtimes.py', 'tools/build_litert_extensions.py', 'tools/litert_extensions.py', 'tools/test_litert_status_abi.py', 'requirements-litert-macos.lock', 'third_party/litert_lm/*.patch') }}
      - name: Assemble complete ad hoc application
        env:
          FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
          FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        run: |
          .venv/bin/python tools/package_macos.py --output 'dist/Open Foresight.app' --identity - --sdk build/sdk \
            --python-runtime build/macos-runtimes/python \
            --litert-extensions-manifest build/macos-runtimes/litert-extensions/build-manifest.json \
            --whisper-runtime build/macos-runtimes/whisper/whisper-cli \
            --whisper-license build/macos-runtimes/whisper/LICENSE
          codesign --verify --deep --strict --verbose=2 'dist/Open Foresight.app'
      - name: Verify bundled inference without developer environment
        run: |
          .venv/bin/python tools/verify_macos_release_runtime.py 'dist/Open Foresight.app' \
            --output test-results/macos-release-runtime.json
      - name: Live release distribution acceptance
        if: inputs.package-release
        env:
          FORESIGHT_SEARCH_API_KEY: ${{ secrets.FORESIGHT_SEARCH_API_KEY }}
          FORESIGHT_WEB_CONTENT_API_KEY: ${{ secrets.FORESIGHT_WEB_CONTENT_API_KEY }}
        run: |
          if [[ -n "$FORESIGHT_SEARCH_API_KEY" && -n "$FORESIGHT_WEB_CONTENT_API_KEY" ]]; then
            task_report="$PWD/test-results/cloud-distribution.json"
            task_resources="$PWD/dist/Open Foresight.app/Contents/Resources"
            # Prove the shipped configuration works without secret overrides.
            (cd packages/foresight_core && env -u FORESIGHT_SEARCH_API_KEY -u FORESIGHT_WEB_CONTENT_API_KEY \
              FORESIGHT_RESOURCES="$task_resources" \
              dart run tool/verify_cloud_services.dart --download-query) > "$task_report"
          else
            echo 'Cloud distribution acceptance skipped: no distribution settings supplied.'
          fi
      - name: Real release-model CPU acceptance
        if: inputs.package-release
        run: |
          .venv/bin/python tools/test_macos_release_models.py 'dist/Open Foresight.app' \
            --models build/release-acceptance-models --output test-results/release-models
      - name: Installed application tooling tests
        run: .venv/bin/python -m unittest discover -s tests -p test_macos_tools.py -v
      - name: Relocated application MCP smoke with minimal environment
        run: |
          .venv/bin/python tools/smoke_macos_bundle.py 'dist/Open Foresight.app' \
            --output test-results/macos-bundle.json
      - name: Retain development package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-evidence
          path: |
            dist/*.manifest.json
            build/macos-runtimes/runtime-manifest.json
            build/Testing/Temporary/LastTest.log
            test-results/
          if-no-files-found: ignore
      - name: Archive tested application for DMG packaging
        if: inputs.package-release
        run: ditto -c -k --keepParent 'dist/Open Foresight.app' dist/Open-Foresight-macos-arm64.zip
      - name: Retain release application
        if: inputs.package-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-application
          path: |
            dist/Open-Foresight-macos-arm64.zip
            dist/Open Foresight.manifest.json
          if-no-files-found: error
          retention-days: 14

  linux-native:
    # Arch provides a current Edition 2024 capable protoc and the matching
    # gRPC runtime; Ubuntu's older distro protobuf cannot compile this schema.
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Linux native toolchain
        run: pacman -Syu --noconfirm cmake ninja gcc git grpc protobuf nlohmann-json sqlite python python-pip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Build native helper and run Linux regression gates
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          .venv/bin/python tests/integration/test_native_process.py \
            build/native/libforesight_native.so build/services/helper/ForesightHelper
