name: CI qualification index
on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  workflow_run:
    workflows: [CI candidate qualification, Preview packages, Arch rolling toolchain drift, Publish Linux application caches]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-qualification-index
  cancel-in-progress: false
jobs:
  publish-index:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Independently verify actual hosted qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_qualification_index.py --output build/qualification-index/index.json
      - name: Publish reviewed-main index from its original producer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-qualification-index
          path: build/qualification-index/index.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
