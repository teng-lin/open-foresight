name: CI qualification index
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  workflow_run:
    workflows: [CI candidate qualification, Preview packages, Arch Linux rolling drift, Publish Linux application caches]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-qualification-index
  cancel-in-progress: false
jobs:
  publish-index:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Independently verify actual hosted qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_qualification_index.py --output build/qualification-index/index.json
      - name: Publish reviewed-main index from its original producer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-qualification-index
          path: build/qualification-index/index.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
