name: Set up the pinned Arch Linux application stage
description: Install the shared Linux compiler, language SDKs and validation dependencies
inputs:
  stage:
    required: true
    description: Native, core, desktop or service role
  publish-language-caches:
    default: 'false'
    description: Dedicated reviewed-main maintenance publisher only
runs:
  using: composite
  steps:
    - name: Validate setup role
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        case "$STAGE" in native|core|desktop|service) ;; *) exit 2 ;; esac
    - name: Trust only the checked out container workspace
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
    - name: Install Linux application toolchain
      shell: bash
      run: pacman -S --needed --noconfirm cmake ninja gcc grpc protobuf nlohmann-json sqlite python python-pip uv clang gtk3 pkgconf pipewire unzip xz mesa libglvnd xorg-server-xvfb xorg-xauth dbus poppler unrtf bubblewrap which github-cli
    # Descriptor audits use the reviewed compiler. C++ bindings still use the
    # protobuf::protoc imported target paired with Arch's Protobuf library.
    - name: Install pinned descriptor compiler
      if: inputs.stage == 'native'
      shell: bash
      run: |
        task_protoc="$RUNNER_TEMP/descriptor-protoc"
        curl --fail --location --retry 3 --max-time 120 -o "$task_protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
        printf '%s  %s\n' '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7' "$task_protoc.zip" | sha256sum --check
        unzip -q "$task_protoc.zip" -d "$task_protoc"
        test "$("$task_protoc/bin/protoc" --version)" = 'libprotoc 35.1'
        echo "$task_protoc/bin" >> "$GITHUB_PATH"
    - name: Install locked Python development dependencies
      shell: bash
      env:
        UV_PYTHON_INSTALL_DIR: /opt/foresight-python
      run: |
        # Select the already-required Python 3.13 instead of Arch's rolling default.
        uv python install 3.13
        task_python=$(uv python find --managed-python 3.13)
        "$task_python" -m venv .venv
        .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
        .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
    - name: Select the language cache role
      if: inputs.stage != 'native'
      id: language-cache
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        case "$STAGE" in desktop|service) kind=ui ;; *) kind=dart ;; esac
        echo "kind=$kind" >> "$GITHUB_OUTPUT"
        mkdir -p "$GITHUB_WORKSPACE/.cache/foresight-pub"
        echo "PUB_CACHE=$GITHUB_WORKSPACE/.cache/foresight-pub" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.stage != 'native'
      id: flutter
      with:
        path: /opt/foresight-flutter
        key: flutter-linux-x64-3.35.7-${{ steps.language-cache.outputs.kind }}-v2
        restore-keys: |
          flutter-linux-x64-3.35.7-${{ steps.language-cache.outputs.kind }}-
          flutter-linux-x64-3.35.7-v1
          flutter-linux-x64-3.35.7-
    - name: Verify the pinned Linux Flutter SDK
      if: inputs.stage != 'native'
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: /opt/foresight-flutter
      run: |
        if [[ ! -x /opt/foresight-flutter/bin/flutter ]]; then
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git /opt/foresight-flutter
        fi
        test "$(git -C /opt/foresight-flutter rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
        echo /opt/foresight-flutter/bin >> "$GITHUB_PATH"
        if [[ "$STAGE" == desktop || "$STAGE" == service ]]; then
          /opt/foresight-flutter/bin/flutter config --enable-linux-desktop --no-analytics
        fi
        /opt/foresight-flutter/bin/dart --version
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.stage != 'native'
      id: pub
      with:
        path: ${{ github.workspace }}/.cache/foresight-pub
        key: pub-linux-${{ steps.language-cache.outputs.kind }}-v2-${{ (inputs.stage == 'desktop' || inputs.stage == 'service') && hashFiles('packages/foresight_core/pubspec.lock', 'apps/desktop/pubspec.lock') || hashFiles('packages/foresight_core/pubspec.lock') }}
        restore-keys: |
          pub-linux-${{ steps.language-cache.outputs.kind }}-v2-
          pub-linux-
    - name: Warm the pinned desktop engine cache
      if: inputs.stage == 'desktop' || inputs.stage == 'service'
      shell: bash
      run: flutter precache --linux
    - name: Resolve locked language prerequisites for isolated stages
      if: inputs.stage != 'native'
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        (cd packages/foresight_core && dart pub get --enforce-lockfile)
        if [[ "$STAGE" == desktop || "$STAGE" == service ]]; then
          (cd apps/desktop && flutter pub get --enforce-lockfile)
        fi
    - name: Guard dedicated language cache publication
      if: inputs.publish-language-caches == 'true'
      id: publish-current
      shell: bash
      run: .venv/bin/python tools/ci_cache_publish_guard.py
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.publish-language-caches == 'true' && steps.publish-current.outputs.current == 'true' && inputs.stage != 'native' && steps.flutter.outputs.cache-hit != 'true'
      with:
        path: /opt/foresight-flutter
        key: flutter-linux-x64-3.35.7-${{ steps.language-cache.outputs.kind }}-v2
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.publish-language-caches == 'true' && steps.publish-current.outputs.current == 'true' && inputs.stage != 'native' && steps.pub.outputs.cache-hit != 'true'
      with:
        path: ${{ github.workspace }}/.cache/foresight-pub
        key: pub-linux-${{ steps.language-cache.outputs.kind }}-v2-${{ (inputs.stage == 'desktop' || inputs.stage == 'service') && hashFiles('packages/foresight_core/pubspec.lock', 'apps/desktop/pubspec.lock') || hashFiles('packages/foresight_core/pubspec.lock') }}
    - name: Record compiler, runtime, package and workspace identity
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: .venv/bin/python tools/ci_stage_environment.py --platform linux --stage "$STAGE" --output build/stage-environment.json
