[tool.ruff]
target-version = "py313"
extend-exclude = ["build", "dist", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "B"]
# Commands use argument vectors, including deliberately configurable build tools.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Assertions are test expectations; fixtures intentionally exercise secrets/HTTP.
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S311"]
"tools/test_*.py" = ["S101", "S105", "S106", "S108", "S110"]
"tools/original_query_oracle/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["tools", "native/setup_models.py", "packaging"]
exclude = ["build/", "dist/", "third_party/"]
# Check every production script, including script functions without annotations.
# Tests use dynamic native API doubles; ruff and runtime tests cover that tree.
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true

# Start the Stage E per-module ratchet at the shared timing leaf.
[[tool.mypy.overrides]]
module = "tools.ci_timing"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
