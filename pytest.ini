[pytest]
# Ordinary offline tests are discovered automatically. Explicit paths still run
# the build/device integration suites recorded in pytest-exclusions.json.
testpaths = tests
norecursedirs = tests/integration tests/service
addopts = --ignore=tests/inference/test_grounding_corpus.py --ignore=tests/inference/test_native_query.py --ignore=tests/inference/test_probe_failure.py --ignore=tests/inference/test_raw_query_model.py
pythonpath = .
