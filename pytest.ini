[pytest]
# Only suites that run without a native build, models, or physical devices.
# Explicit paths (e.g. pytest tests/service) still select integration suites.
testpaths =
    tests/contracts
    tests/inference
    tests/models
    tests/test_coverage.py
    tests/test_linux_packages.py
    tests/test_litert_extensions.py
    tests/test_macos_bundle.py
    tests/test_macos_tools.py
    tests/test_profile_migration.py
pythonpath = .
